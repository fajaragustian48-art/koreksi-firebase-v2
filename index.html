<style>
/* ===================== DESIGN SYSTEM & TOKENS ===================== */
#ljkApp {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --pill: #F1F5F9;
  --pri: #1D74F5;
  --pri2: #155EC9;
  --pri-soft: rgba(29, 116, 245, 0.1);
  --ink: #0F172A;
  --body: #334155;
  --muted: #64748B;
  --subtle: #94A3B8;
  --line: #E2E8F0;
  --line2: #F1F5F9;
  --amber: #F59E0B;
  --rose: #F43F5E;
  --emerald: #10B981;
  --indigo: #6366F1;
  --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  background: var(--bg);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}
#ljkApp *, #ljkApp *::before, #ljkApp *::after { box-sizing: border-box; }
#ljkApp h1, #ljkApp h2, #ljkApp h3, #ljkApp h4, #ljkApp p { margin: 0; }
#ljkApp button, #ljkApp input, #ljkApp select, #ljkApp textarea { font: inherit; color: inherit; }
#ljkApp button { cursor: pointer; border: 0; background: none; }
#ljkApp svg { flex-shrink: 0; display: inline-block; vertical-align: middle; }

/* ===================== 3-COLUMN APP SHELL ===================== */
#ljkApp .shell {
  position: absolute;
  inset: 0;
  display: flex;
  background: var(--bg);
  overflow: hidden;
}

/* Left Fixed & Collapsible Sidebar */
#ljkApp .side {
  width: 244px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 16px 14px;
  flex-shrink: 0;
  transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), padding 0.25s ease;
  z-index: 20;
}
#ljkApp .side.min {
  width: 76px;
  padding: 16px 10px;
}
#ljkApp .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 4px 14px;
  border-bottom: 1px solid var(--line2);
  margin-bottom: 10px;
}
#ljkApp .side.min .brand {
  flex-direction: column;
  gap: 8px;
  padding-bottom: 12px;
}
#ljkApp .logo {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--pri), #38BDF8);
  color: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 16px rgba(29, 116, 245, 0.22);
  flex-shrink: 0;
  overflow: hidden;
}
#ljkApp .logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #fff;
  padding: 3px;
}
#ljkApp .brand-txt { min-width: 0; flex: 1; }
#ljkApp .brand-txt b {
  display: block;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ljkApp .brand-txt small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ljkApp .side.min .brand-txt { display: none; }
#ljkApp .col-btn {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: var(--pill);
  color: var(--muted);
  display: grid;
  place-items: center;
  transition: 0.2s;
  flex-shrink: 0;
}
#ljkApp .col-btn:hover { background: var(--pri-soft); color: var(--pri); }

#ljkApp .nav-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow-y: auto;
  padding-right: 2px;
  flex: 1;
}
#ljkApp .nav-grp {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--subtle);
  padding: 10px 12px 4px;
}
#ljkApp .nav-grp:first-child { padding-top: 2px; }
#ljkApp .side.min .nav-grp { display: none; }

#ljkApp .nav {
  display: flex;
  align-items: center;
  gap: 11px;
  height: 40px;
  padding: 0 13px;
  border-radius: 12px;
  color: var(--body);
  font-weight: 600;
  font-size: 13px;
  transition: 0.18s;
  white-space: nowrap;
}
#ljkApp .nav:hover { background: var(--pill); color: var(--ink); }
#ljkApp .nav.on {
  background: var(--pri);
  color: #fff;
  box-shadow: 0 6px 16px -4px rgba(29, 116, 245, 0.45);
}
#ljkApp .side.min .nav {
  justify-content: center;
  padding: 0;
  width: 44px;
  height: 44px;
  margin: 0 auto;
}
#ljkApp .side.min .nav span { display: none; }

#ljkApp .side-foot {
  padding-top: 10px;
  border-top: 1px solid var(--line2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#ljkApp .side-user {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  border: 1px solid var(--line2);
  padding: 9px 11px;
  border-radius: 14px;
}
#ljkApp .side.min .side-user { justify-content: center; padding: 8px; }
#ljkApp .av {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: var(--pri-soft);
  color: var(--pri);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 12px;
  flex-shrink: 0;
}
#ljkApp .side-user-info { min-width: 0; flex: 1; }
#ljkApp .side-user-info b {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ljkApp .side-user-info small {
  display: block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--pri);
}
#ljkApp .side.min .side-user-info { display: none; }

#ljkApp .logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 38px;
  border-radius: 12px;
  background: #FFF1F2;
  color: #E11D48;
  font-weight: 700;
  font-size: 12.5px;
  transition: 0.18s;
}
#ljkApp .logout-btn:hover { background: #FFE4E6; }
#ljkApp .side.min .logout-btn span { display: none; }

/* Center Main Workspace */
#ljkApp .main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 18px 24px 36px;
  scroll-behavior: smooth;
}
#ljkApp .top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
#ljkApp .search {
  flex: 1;
  max-width: 440px;
  position: relative;
}
#ljkApp .search input {
  width: 100%;
  height: 40px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 0 18px 0 40px;
  outline: none;
  font-size: 13px;
  transition: 0.2s;
}
#ljkApp .search input:focus {
  border-color: var(--pri);
  box-shadow: 0 0 0 3px var(--pri-soft);
}
#ljkApp .search svg.s {
  position: absolute;
  left: 14px;
  top: 11px;
  color: var(--subtle);
}
#ljkApp .tr {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
#ljkApp .status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
}
#ljkApp .status-chip svg { color: var(--emerald); }
#ljkApp .ib {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  position: relative;
  color: var(--body);
  transition: 0.2s;
}
#ljkApp .ib:hover { background: var(--pri-soft); color: var(--pri); }
#ljkApp .ib .dot {
  position: absolute;
  top: 8px;
  right: 9px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rose);
  border: 2px solid #fff;
}

/* Right Utility & Stats Rail */
#ljkApp .rail {
  width: 296px;
  background: var(--bg);
  border-left: 1px solid var(--line);
  padding: 18px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex-shrink: 0;
}
#ljkApp .rcard {
  background: var(--surface);
  border: 1px solid var(--line2);
  border-radius: 22px;
  padding: 18px;
  box-shadow: var(--shadow);
}
#ljkApp .rcard h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }

#ljkApp .cls-prog-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 14px;
  background: var(--bg);
  margin-bottom: 8px;
}
#ljkApp .cls-prog-row:last-child { margin-bottom: 0; }
#ljkApp .rank {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 800;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
  flex-shrink: 0;
}
#ljkApp .rank.r1 { background: #FEF3C7; border-color: #FDE68A; color: #B45309; }
#ljkApp .rank.r2 { background: #E2E8F0; border-color: #CBD5E1; color: #334155; }
#ljkApp .rank.r3 { background: #FFEDD5; border-color: #FED7AA; color: #C2410C; }

/* ===================== HERO BANNER & DASHBOARD CARDS ===================== */
#ljkApp .hero {
  background: linear-gradient(125deg, #93C5FD 0%, #60A5FA 48%, #3B82F6 100%);
  border-radius: 24px;
  padding: 26px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  position: relative;
  overflow: hidden;
  margin-bottom: 20px;
  box-shadow: 0 12px 28px -8px rgba(37, 99, 235, 0.35);
}
#ljkApp .hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(8px);
  padding: 5px 13px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 12px;
}
#ljkApp .hero-pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--emerald);
  display: inline-block;
}
#ljkApp .hero h2 {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.22;
  letter-spacing: -0.02em;
  color: #0F172A;
  margin-bottom: 8px;
}
#ljkApp .hero p {
  max-width: 460px;
  font-size: 13px;
  color: #1E293B;
  margin-bottom: 18px;
}
#ljkApp .hero-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
#ljkApp .hero-icon-box {
  width: 84px;
  height: 84px;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.42);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.55);
  color: #1D4ED8;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

#ljkApp .sec {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 0 12px;
  gap: 10px;
}
#ljkApp .sec h2, #ljkApp .sec h3 { font-size: 15.5px; font-weight: 700; }
#ljkApp .link { font-size: 12px; font-weight: 700; color: var(--pri); }

#ljkApp .active-card {
  background: var(--surface);
  border: 1px solid var(--line2);
  border-radius: 20px;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
#ljkApp .active-row {
  display: flex;
  align-items: center;
  gap: 16px;
}
#ljkApp .active-thumb {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: var(--pri);
  color: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 6px 14px rgba(29, 116, 245, 0.25);
}
#ljkApp .active-mid { flex: 1; min-width: 0; }
#ljkApp .active-mid b { display: block; font-size: 14.5px; font-weight: 700; }
#ljkApp .active-mid small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
#ljkApp .prog-row { display: flex; align-items: center; gap: 12px; max-width: 380px; }
#ljkApp .pbar {
  flex: 1;
  height: 7px;
  border-radius: 999px;
  background: #E2E8F0;
  overflow: hidden;
}
#ljkApp .pbar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--pri);
  transition: width 0.5s ease;
}

/* 4 Pastel Quick Action Bento Cards */
#ljkApp .g4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}
#ljkApp .pcard {
  border-radius: 18px;
  padding: 14px 16px;
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid rgba(15, 23, 42, 0.04);
}
#ljkApp .pcard:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.09);
}
#ljkApp .pcard .top-r { display: flex; align-items: center; gap: 11px; min-width: 0; }
#ljkApp .pcard .pico {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  color: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
#ljkApp .pcard b { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); }
#ljkApp .pcard small { display: block; font-size: 11.5px; color: var(--muted); }

/* Active Student Highlight Card (Emerald) */
#ljkApp .stu-active-card {
  background: #ECFDF5;
  border: 1.5px solid #A7F3D0;
  border-radius: 18px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
#ljkApp .stu-cls-badge {
  min-width: 46px;
  height: 46px;
  padding: 0 8px;
  border-radius: 13px;
  background: #059669;
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
#ljkApp .stu-active-card .tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #059669;
}

/* Watermarked Score Result Cards */
#ljkApp .wm-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}
#ljkApp .wm-card {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
#ljkApp .wm-card small {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  position: relative;
  z-index: 2;
}
#ljkApp .wm-card b {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 2px;
  position: relative;
  z-index: 2;
}
#ljkApp .wm-card .wm-ico {
  position: absolute;
  right: -6px;
  bottom: -8px;
  opacity: 0.13;
  transform: rotate(-10deg);
  pointer-events: none;
  z-index: 1;
}

#ljkApp .card {
  background: var(--surface);
  border: 1px solid var(--line2);
  border-radius: 22px;
  padding: 18px 20px;
  box-shadow: var(--shadow);
}
#ljkApp .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }

/* ===================== BUTTONS, INPUTS, BADGES & TABLES ===================== */
#ljkApp .phead {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
#ljkApp .phead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
#ljkApp .phead p { color: var(--muted); font-size: 13px; }
#ljkApp .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

#ljkApp .btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 40px;
  padding: 0 18px;
  border-radius: 999px;
  background: var(--pri);
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  transition: 0.18s;
  white-space: nowrap;
}
#ljkApp .btn:hover { background: var(--pri2); transform: translateY(-1px); }
#ljkApp .btn.white { background: #fff; color: var(--ink); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08); }
#ljkApp .btn.white:hover { background: #F8FAFC; }
#ljkApp .btn.amber { background: var(--amber); color: #fff; }
#ljkApp .btn.amber:hover { background: #D97706; }

function parseDelimitedText(text) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim() !== '');
  return lines.map(line => {
    const sep = line.includes('\t') ? '\t' : (line.includes(';') ? ';' : ',');
    const out = [];
    let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; }
          else q = false;
        } else cur += c;
      } else if (c === '"') {
        q = true;
      } else if (c === sep) {
        out.push(cur.trim());
        cur = '';
      } else {
        cur += c;
      }
    }
    out.push(cur.trim());
    return out;
  });
}

function applyTheme() {
  const rootEl = $('#ljkApp');
  if (!rootEl) return;
  const hex = (D().settings.theme_color || '#1D74F5').trim();
  if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const dark = '#' + [r, g, b].map(v => Math.max(0, Math.round(v * 0.82)).toString(16).padStart(2, '0')).join('');
    rootEl.style.setProperty('--pri', hex);
    rootEl.style.setProperty('--pri2', dark);
    rootEl.style.setProperty('--pri-soft', `rgba(${r}, ${g}, ${b}, 0.1)`);
  }
}

function uniqueCheck(key, r) {
  const t = COL[key];
  const dup = f => MEM[t].some(x => String(x[f] || '').toLowerCase() === String(r[f] || '').toLowerCase() && x.id !== r.id);
  if ((key === 'guru' && dup('username')) || (key === 'siswa' && dup('nis')) || (key === 'mapel' && dup('nama'))) {
    throw new Error('Data duplikat: NIS, username, atau nama mata pelajaran sudah terdaftar.');
  }
}

async function dbAll(key) {
  const t = COL[key];
  if (IS_PREVIEW) return clone(MEM[t]);
  const snap = await getDocs(collection(db, t));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function dbInsert(key, rows) {
  const t = COL[key];
  const arr = Array.isArray(rows) ? rows : [rows];
  if (IS_PREVIEW) {
    const out = arr.map(r => ({ id: uid(), created_at: new Date().toISOString(), ...r }));
    out.forEach(r => uniqueCheck(key, r));
    MEM[t].push(...out);
    return clone(out);
  }
  const out = [];
  const chunkSize = 25;
  for (let i = 0; i < arr.length; i += chunkSize) {
    const slice = arr.slice(i, i + chunkSize);
    const saved = await Promise.all(slice.map(async r => {
      const payload = { created_at: new Date().toISOString(), ...r };
      const ref = await addDoc(collection(db, t), payload);
      return { id: ref.id, ...payload };
    }));
    out.push(...saved);
  }
  return out;
}

    if (j.jumlah_esai === 0) {

      const defMax = j.jumlah_esai > 0 ? Math.round((100 / j.jumlah_esai) * 10) / 10 : 10;

  });

/* ===================== HELPER DOMAIN & PERHITUNGAN SKOR (PG + ESAI) ===================== */
function scoreCombined(ansPG, keyPG, esaiScores, j) {
  let b = 0, s = 0, k = 0;
  for (let i = 0; i < j.jumlah_soal; i++) {
    const a = ansPG[i] || '';
    if (a === '') k++;
    else if (a === keyPG[i]) b++;
    else s++;
  }
  const nilaiPG = j.jumlah_soal > 0 ? (b / j.jumlah_soal) * 100 : 0;

  let nilaiEsai = 0;
  const nEsai = Number(j.jumlah_esai) || 0;
  if (nEsai > 0) {
    const maksArr = j.skor_maks_esai || Array(nEsai).fill(10);
    const totalMaks = maksArr.reduce((sum, v) => sum + (Number(v) || 0), 0);
    const totalPerolehan = Array.from({ length: nEsai }, (_, i) => Math.max(0, Math.min(Number(maksArr[i]) || 0, Number(esaiScores?.[i]) || 0))).reduce((sum, v) => sum + v, 0);
    nilaiEsai = totalMaks > 0 ? (totalPerolehan / totalMaks) * 100 : 0;
  }

  const bp = nEsai > 0 ? (Number(j.bobot_pg) ?? 80) : 100;
  const be = nEsai > 0 ? (Number(j.bobot_esai) ?? (100 - bp)) : 0;
  const totalBobot = (bp + be) || 100;
  const nilaiAkhir = ((nilaiPG * bp) + (nilaiEsai * be)) / totalBobot;

  return {
    benar: b,
    salah: s,
    kosong: k,
    nilai_pg: Math.round(nilaiPG * 100) / 100,
    nilai_esai: Math.round(nilaiEsai * 100) / 100,
    nilai: Math.round(Math.max(0, Math.min(100, nilaiAkhir)) * 100) / 100
  };
}

function circularRing(pct, big, small, size = 138, th = 12) {
  const r = (size - th) / 2;
  const c = 2 * Math.PI * r;
  const cx = size / 2;
  const dash = Math.max(0, Math.min(100, pct)) / 100 * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:8px auto">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#E2E8F0" stroke-width="${th}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--pri)" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 ${cx} ${cx})"/>
    <text x="${cx}" y="${cx + 2}" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">${esc(big)}</text>
    <text x="${cx}" y="${cx + 18}" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">${esc(small)}</text>
  </svg>`;
}

/* ===================== GEOMETRI OMR & STUDIO CETAK LJK UNIVERSAL (A4) ===================== */
const G = { S: 4, W: 840, H: 1188, x0: 16, colW: 37, px: 5.6, py: 9, y0: 122, per: 10, r: 2.3 };
const bx = (q, j) => G.x0 + G.colW * Math.floor(q / G.per) + 9.5 + G.px * j;
const by = q => G.y0 + G.py * (q % G.per);

function renderKopMiniSVG(set, offX, topY, width) {
  const lines = (set.kop_lines || DEFAULT_KOP_LINES).filter(l => l.show !== false && (l.text || '').trim() !== '');
  const cx = offX + width / 2;
  const scale = width / 170;
  let g = '';
  const hasL = Boolean((set.logo_kiri || '').trim());
  const hasR = Boolean((set.logo_kanan || '').trim());
  const logoSz = 19 * scale;
  if (hasL) g += `<image href="${esc(set.logo_kiri)}" x="${offX}" y="${topY}" width="${logoSz}" height="${logoSz}" preserveAspectRatio="xMidYMid meet"/>`;
  if (hasR) g += `<image href="${esc(set.logo_kanan)}" x="${offX + width - logoSz}" y="${topY}" width="${logoSz}" height="${logoSz}" preserveAspectRatio="xMidYMid meet"/>`;

  let y = topY + 4 * scale;
  lines.forEach(l => {
    const sz = Math.max(2.0, Math.min(5.5, (Number(l.size) || 11) * 0.31 * scale));
    const fw = l.bold ? 'bold' : 'normal';
    const fs = l.italic ? 'italic' : 'normal';
    const td = l.underline ? 'underline' : 'none';
    g += `<text x="${cx}" y="${y.toFixed(2)}" font-size="${sz.toFixed(2)}" font-weight="${fw}" font-style="${fs}" text-decoration="${td}" text-anchor="middle" fill="#000" font-family="Arial,Helvetica,sans-serif">${esc(l.text)}</text>`;
    y += sz + 1.25 * scale;
  });

  const lineY = Math.max(topY + 21 * scale, y + 0.6);
  g += `<line x1="${offX}" y1="${lineY.toFixed(2)}" x2="${offX + width}" y2="${lineY.toFixed(2)}" stroke="#000" stroke-width="0.6"/>`;
  g += `<line x1="${offX}" y1="${(lineY + 1.0).toFixed(2)}" x2="${offX + width}" y2="${(lineY + 1.0).toFixed(2)}" stroke="#000" stroke-width="0.25"/>`;
  return { svg: g, endY: lineY + 2 };
}

/* Bangun 1 Lembar LJK Standar (210 x 297 mm) agar 100% kompatibel dengan OMR Scanner */
function buildSingleLJKSvgInner(cfg) {
  const set = D().settings;
  const pgOn = cfg.pgOn !== false;
  const pgOrder = cfg.pgOrder === 'row' ? 'row' : 'col';
  const cols = Math.max(1, Math.min(5, Number(cfg.cols) || 5));
  const rows = Math.max(1, Math.min(25, Number(cfg.rows) || 10));
  const maxPg = Math.max(1, Math.min(50, Number(cfg.maxPg) || 50));
  const opsi = Number(cfg.opsi) === 4 ? 4 : 5;
  const zoom = Math.max(70, Math.min(130, Number(cfg.zoom) || 100)) / 100;
  const esaiOn = Boolean(cfg.esaiOn);
  const esaiCount = Math.max(1, Math.min(15, Number(cfg.esaiCount) || 5));
  const judul = (cfg.judul || 'LEMBAR JAWABAN SUMATIF AKHIR SEMESTER (LJK)').toUpperCase();

  const R = (x, y, w, h, f = '#000') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
  const T = (x, y, t, sz = 3.0, w = 'normal', a = 'start', f = '#000') => `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" text-anchor="${a}" fill="${f}" font-family="Arial,Helvetica,sans-serif">${esc(t)}</text>`;

  // 4 Penanda Sudut OMR (3 kecil 8x8 + 1 penanda jangkar kanan-bawah 12x12)
  let g = `<rect width="210" height="297" fill="#fff"/>`
    + R(8, 8, 8, 8)
    + R(194, 8, 8, 8)
    + R(8, 281, 8, 8)
    + R(192, 279, 12, 12);

  const kop = renderKopMiniSVG(set, 20, 12, 170);
  g += kop.svg;

  const bannerY = Math.max(46, kop.endY + 2);
  g += `<rect x="20" y="${bannerY}" width="170" height="7" rx="1.2" fill="none" stroke="#000" stroke-width="0.4"/>`;
  g += T(105, bannerY + 4.8, judul, 3.4, 'bold', 'middle', '#000');

  const boxY = bannerY + 9.2;
  g += `<rect x="20" y="${boxY}" width="112" height="10.5" rx="1.4" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(22.5, boxY + 4, 'NAMA LENGKAP PESERTA', 2.2, 'bold');
  g += T(22.5, boxY + 8.5, '..................................................................................', 2.6);

  g += `<rect x="135" y="${boxY}" width="55" height="10.5" rx="1.4" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(137.5, boxY + 4, 'NO. PESERTA / NIS', 2.2, 'bold');
  g += T(137.5, boxY + 8.5, '......................................', 2.6);

  const boxY2 = boxY + 12.2;
  g += `<rect x="20" y="${boxY2}" width="112" height="10.5" rx="1.4" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(22.5, boxY2 + 4, 'MATA PELAJARAN', 2.2, 'bold');
  g += T(22.5, boxY2 + 8.5, '..................................................................................', 2.6);

  g += `<rect x="135" y="${boxY2}" width="55" height="10.5" rx="1.4" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(137.5, boxY2 + 4, 'KELAS / RUANG', 2.2, 'bold');
  g += T(137.5, boxY2 + 8.5, '......................................', 2.6);

  let afterPgY = 122;
  if (pgOn) {
    g += T(105, 108, 'AREA JAWABAN PILIHAN GANDA', 2.8, 'bold', 'middle');
    const totalSlots = Math.min(maxPg, cols * rows);
    const colW = 185 / cols;
    const rad = G.r * zoom;
    const stepX = Math.min(5.6, (colW - 11) / opsi);
    const stepY = rows <= 10 ? 9 : Math.max(6.2, 92 / rows);

    for (let idx = 0; idx < totalSlots; idx++) {
      const c = pgOrder === 'col' ? Math.floor(idx / rows) : (idx % cols);
      const r = pgOrder === 'col' ? (idx % rows) : Math.floor(idx / cols);
      const qNum = idx + 1;
      const baseX = (cols === 5 && rows === 10 && pgOrder === 'col') ? (G.x0 + G.colW * c) : (14 + colW * c);
      const cy = (cols === 5 && rows === 10 && pgOrder === 'col') ? (G.y0 + G.py * r) : (122 + stepY * r);
      g += T(baseX + 5.8, cy + 1.05, String(qNum).padStart(2, '0') + '.', 2.8, 'bold', 'end');
      for (let jj = 0; jj < opsi; jj++) {
        const cx = (cols === 5 && rows === 10 && pgOrder === 'col') ? bx(idx, jj) : (baseX + 9.5 + stepX * jj);
        g += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${rad.toFixed(2)}" fill="none" stroke="#000" stroke-width="0.32"/>`;
        g += T(cx, cy + 0.85, LET[jj], 2.1 * zoom, 'bold', 'middle', '#222');
      }
      afterPgY = Math.max(afterPgY, cy + 8);
    }
    g += T(105, afterPgY + 2, 'Pastikan keempat kotak hitam sudut terlihat jelas saat difoto / discan', 2.3, 'normal', 'middle', '#444');
  }

  if (esaiOn) {
    let ey = pgOn ? Math.max(216, afterPgY + 7) : 106;
    g += T(105, ey, 'AREA JAWABAN URAIAN / ESAI', 2.8, 'bold', 'middle');
    ey += 4;
    const availH = 266 - ey;
    const lineGap = Math.max(5.5, Math.min(11, availH / esaiCount));
    for (let i = 0; i < esaiCount; i++) {
      const yLine = ey + (i + 1) * lineGap;
      if (yLine < 268) {
        g += T(20, yLine - 1.2, `${i + 1}.`, 2.6, 'bold');
        g += `<line x1="26" y1="${yLine.toFixed(1)}" x2="190" y2="${yLine.toFixed(1)}" stroke="#64748B" stroke-width="0.3" stroke-dasharray="1,0.8"/>`;
      }
    }
  }

  g += T(105, 290, `Template LJK Universal — ${set.app_name || 'Sistem Koreksi Hasil Sumatif Akhir Semester'}`, 2.2, 'normal', 'middle', '#64748B');
  return g;
}

function buildStudioLJKSVG(cfg) {
  const perSheet = Number(cfg.perSheet) === 2 ? 2 : 1;
  const singleInner = buildSingleLJKSvgInner(cfg);

  // Mode 1 LJK / Lembar (A4 Portrait 210 x 297 mm)
  if (perSheet === 1) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm">${singleInner}</svg>`;
  }

  // Mode 2 LJK / Lembar (A4 Landscape 297 x 210 mm):
  // Menggunakan 2 salinan LJK 1-lembar (rasio 210:297 = 148.5:210) berdampingan sehingga setelah dipotong tengah 100% terbaca oleh scanner OMR!
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 210" width="297mm" height="210mm">
    <rect width="297" height="210" fill="#fff"/>
    <svg x="0" y="0" width="148.5" height="210" viewBox="0 0 210 297" preserveAspectRatio="xMidYMid meet">${singleInner}</svg>
    <svg x="148.5" y="0" width="148.5" height="210" viewBox="0 0 210 297" preserveAspectRatio="xMidYMid meet">${singleInner}</svg>
    <line x1="148.5" y1="2" x2="148.5" y2="208" stroke="#64748B" stroke-width="0.4" stroke-dasharray="2.5,2"/>
  </svg>`;
}

/* ---------- 2. Scan LJK (Pilihan Ganda) ---------- */
let CVP = null;
function loadOpenCV() {
  if (CVP) return CVP;
  CVP = new Promise((res, rej) => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.1/dist/opencv.js',
      'https://docs.opencv.org/4.8.0/opencv.js'
    ];
    let ui = 0;
    const ready = () => window.cv && window.cv.Mat;
    if (ready()) return res();
    const next = () => {
      if (ui >= urls.length) { CVP = null; return rej(new Error('Gagal memuat OpenCV.js. Periksa koneksi internet.')); }
      const s = document.createElement('script');
      s.async = true;
      s.src = urls[ui++];
      s.onerror = () => { s.remove(); next(); };
      s.onload = () => {
        let t = 0, thenDone = false;
        const iv = setInterval(() => {
          t++;
          if (ready()) { clearInterval(iv); return res(); }
          if (window.cv && typeof window.cv.then === 'function' && !thenDone) {
            thenDone = true;
            window.cv.then(m => { if (m && m.Mat) window.cv = m; });
          }
          if (t > 400) { clearInterval(iv); CVP = null; rej(new Error('OpenCV.js timeout, coba muat ulang halaman.')); }
        }, 150);
      };
      document.head.appendChild(s);
    };
    next();
  });
  return CVP;
}

function findMarkers(gray, w, h, T) {
  const blur = T(new cv.Mat());
  cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
  const bin = T(new cv.Mat());
  let bs = Math.max(51, Math.round(Math.min(w, h) / 10));
  if (bs % 2 === 0) bs++;
  cv.adaptiveThreshold(blur, bin, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY_INV, bs, 12);
  const cons = T(new cv.MatVector()), hier = T(new cv.Mat());
  cv.findContours(bin, cons, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
  const tot = w * h, cand = [];
  for (let i = 0; i < cons.size(); i++) {
    const c = cons.get(i);
    try {
      const area = cv.contourArea(c);
      if (area < tot * 0.00006 || area > tot * 0.02) continue;
      const rr = cv.minAreaRect(c), rw = rr.size.width, rh = rr.size.height;
      if (!rw || !rh) continue;
      if (Math.min(rw, rh) / Math.max(rw, rh) < 0.6 || area / (rw * rh) < 0.8) continue;
      const r = cv.boundingRect(c), cx0 = r.x + r.width / 2, cy0 = r.y + r.height / 2;
      const pts = [[.57, 0], [-.57, 0], [0, .57], [0, -.57], [.4, .4], [-.4, .4], [.4, -.4], [-.4, -.4]];
      let ink = 0;
      pts.forEach(([fx, fy]) => {
        const x = Math.round(cx0 + fx * r.width / 2), y = Math.round(cy0 + fy * r.height / 2);
        if (x >= 0 && y >= 0 && x < w && y < h && bin.ucharAt(y, x) > 0) ink++;
      });
      if (ink < 7) continue;
      const m = cv.moments(c);
      cand.push({ x: m.m10 / m.m00, y: m.m01 / m.m00, area });
    } finally { c.delete(); }
  }
  cand.sort((a, b) => b.area - a.area);
  const top = cand.slice(0, 9);
  let best = null;
  const sortCW = q => {
    const cx = q.reduce((a, p) => a + p.x, 0) / 4, cy = q.reduce((a, p) => a + p.y, 0) / 4;
    return q.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  };
  const polyArea = q => {
    let a = 0;
    for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; }
    return Math.abs(a) / 2;
  };
  for (let a = 0; a < top.length; a++) for (let b = a + 1; b < top.length; b++) for (let c = b + 1; c < top.length; c++) for (let d = c + 1; d < top.length; d++) {
    const q = [top[a], top[b], top[c], top[d]], ar = q.map(p => p.area).sort((x, y) => x - y);
    if (ar[2] / ar[0] > 1.9) continue;
    const sm = (ar[0] + ar[1] + ar[2]) / 3, ratio = ar[3] / sm;
    if (ratio < 1.5 || ratio > 3.6) continue;
    const pa = polyArea(sortCW(q));
    if (!best || pa > best.pa) best = { q, pa };
  }
  if (!best) return null;
  const cw = sortCW(best.q);
  let k = 0;
  cw.forEach((p, i) => { if (p.area > cw[k].area) k = i; });
  return [cw[(k + 2) % 4], cw[(k + 3) % 4], cw[k], cw[(k + 1) % 4]];
}

async function analyzeImage(srcCanvas) {
  await loadOpenCV();
  const trash = [];
  const T = m => (trash.push(m), m);
  try {
    const sc = Math.min(1, 1800 / Math.max(srcCanvas.width, srcCanvas.height));
    const c0 = document.createElement('canvas');
    c0.width = Math.round(srcCanvas.width * sc);
    c0.height = Math.round(srcCanvas.height * sc);
    c0.getContext('2d').drawImage(srcCanvas, 0, 0, c0.width, c0.height);
    const src = T(cv.imread(c0)), gray = T(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const p = findMarkers(gray, c0.width, c0.height, T);
    if (!p) throw new Error('Penanda hitam di 4 sudut LJK tidak terdeteksi. Pastikan seluruh lembar masuk frame dan pencahayaan merata.');
    const sp = T(cv.matFromArray(4, 1, cv.CV_32FC2, p.flatMap(o => [o.x, o.y])));
    const dp = T(cv.matFromArray(4, 1, cv.CV_32FC2, [12 * G.S, 12 * G.S, 198 * G.S, 12 * G.S, 198 * G.S, 285 * G.S, 12 * G.S, 285 * G.S]));
    const M = T(cv.getPerspectiveTransform(sp, dp)), wc = T(new cv.Mat()), wg = T(new cv.Mat()), sz = new cv.Size(G.W, G.H);
    cv.warpPerspective(src, wc, M, sz, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));
    cv.warpPerspective(gray, wg, M, sz, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255));
    const warp = document.createElement('canvas');
    cv.imshow(warp, wc);
    const bl = T(new cv.Mat()), bin = T(new cv.Mat());
    cv.GaussianBlur(wg, bl, new cv.Size(3, 3), 0);
    cv.adaptiveThreshold(bl, bin, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY_INV, 41, 12);
    return { warp, bin: new Uint8Array(bin.data) };
  } finally {
    trash.forEach(m => { try { m.delete(); } catch (e) { } });
  }
}

function readBubbles(bin, n, k) {
  const R = Math.round(1.3 * G.S), offs = [];
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) if (dx * dx + dy * dy <= R * R) offs.push([dx, dy]);
  const out = [];
  for (let q = 0; q < n; q++) {
    const row = [];
    for (let j = 0; j < k; j++) {
      const cx = Math.round(bx(q, j) * G.S), cy = Math.round(by(q) * G.S);
      let best = 1;
      for (const sy of [-2, 0, 2]) for (const sx of [-2, 0, 2]) {
        let c = 0;
        for (const [dx, dy] of offs) {
          const x = cx + sx + dx, y = cy + sy + dy;
          if (x >= 0 && y >= 0 && x < G.W && y < G.H && bin[y * G.W + x]) c++;
        }
        best = Math.min(best, c / offs.length);
      }
      row.push(best);
    }
    out.push(row);
  }
  return out;
}
function decideRow(row) {
  const mx = Math.max(...row);
  if (mx < 0.35) return '';
  const marked = row.map((v, i) => v >= Math.max(0.35, mx * 0.72) ? i : -1).filter(i => i >= 0);
  return marked.length > 1 ? '*' : LET[marked[0]];
}

const scanJ = () => visJadwal().find(j => j.id === S.ui.scanJ);
function stopCam() { LIVE.on = false; clearTimeout(LIVE.t); try { S.cam?.getTracks().forEach(t => t.stop()); } catch (e) { } S.cam = null; }
const A4R = 210 / 297, LIVE = { on: false, t: 0, stable: 0, last: null, cool: 0, busy: false };

function cropFrame(outW) {
  const v = $('#camVideo');
  if (!v || !v.videoWidth) return null;
  const vw = v.videoWidth, vh = v.videoHeight;
  let sw, sh, sx, sy;
  if (vw / vh > A4R) { sh = vh; sw = vh * A4R; sx = (vw - sw) / 2; sy = 0; }
  else { sw = vw; sh = vw / A4R; sx = 0; sy = (vh - sh) / 2; }
  const c = document.createElement('canvas');
  c.width = Math.round(outW || sw);
  c.height = Math.round((outW || sw) / A4R);
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
async function startCam() {
  stopCam();
  try {
    S.cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const v = $('#camVideo');
    if (v) { v.srcObject = S.cam; await v.play(); $('#camHint')?.remove(); }
    liveStart();
  } catch (e) {
    toast('Kamera tidak dapat diakses: ' + (e.message || e.name) + '. Gunakan Unggah Foto LJK.', 'err', 5000);
  }
}
function snap() {
  const c = cropFrame();
  if (!c) return toast('Kamera belum aktif', 'err');
  handleCanvas(c);
}
async function liveStart() {
  const stat = $('#camStat');
  if (stat) { stat.style.display = 'block'; stat.textContent = 'Memuat pemindai…'; }
  try { await loadOpenCV(); } catch (e) { if (stat) stat.textContent = 'Deteksi otomatis tidak tersedia — gunakan Ambil & Proses'; return; }
  if (!S.cam) return;
  LIVE.on = true; LIVE.stable = 0; LIVE.last = null; LIVE.cool = Date.now() + 800;
  liveTick();
}
function liveDraw(pts, w, h, state) {
  const ov = $('#camOv');
  if (!ov) return;
  if (ov.width !== w) { ov.width = w; ov.height = h; }
  const x = ov.getContext('2d');
  x.clearRect(0, 0, w, h);
  if (!pts) return;
  x.lineWidth = 3;
  x.strokeStyle = state === 'ok' ? '#10B981' : '#F59E0B';
  x.fillStyle = 'rgba(16,185,129,.14)';
  x.beginPath();
  pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
  x.closePath();
  x.fill();
  x.stroke();
  pts.forEach(p => { x.beginPath(); x.arc(p.x, p.y, 7, 0, 7); x.fillStyle = state === 'ok' ? '#10B981' : '#F59E0B'; x.fill(); });
}
function liveTick() {
  if (!LIVE.on || !S.cam || S.page !== 'scan') return;
  LIVE.t = setTimeout(liveTick, 240);
  if (LIVE.busy || S.scanR || !$('#camVideo')) return;
  LIVE.busy = true;
  const trash = [];
  const T = m => (trash.push(m), m);
  try {
    const c = cropFrame(480);
    if (!c) return;
    const w = c.width, h = c.height;
    const src = T(cv.imread(c)), gray = T(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const p = findMarkers(gray, w, h, T), stat = $('#camStat'), box = $('#camBox');
    if (!p) {
      LIVE.stable = 0; LIVE.last = null; liveDraw(null, w, h); box?.classList.remove('ok');
      if (stat) stat.textContent = 'Arahkan kamera: 4 kotak hitam sudut LJK harus terlihat';
      return;
    }
    const moved = LIVE.last ? Math.max(...p.map((o, i) => Math.hypot(o.x - LIVE.last[i].x, o.y - LIVE.last[i].y))) : 999;
    LIVE.stable = moved < 7 ? LIVE.stable + 1 : 1;
    LIVE.last = p.map(o => ({ x: o.x, y: o.y }));
    const ready = LIVE.stable >= 5;
    liveDraw(p, w, h, ready ? 'ok' : 'wait');
    box?.classList.toggle('ok', ready);
    if (stat) stat.textContent = ready ? (S.ui.autoCap ? 'Terdeteksi, memproses…' : 'Terdeteksi — tekan Ambil & Proses') : 'Sudut terdeteksi — tahan kamera stabil…';
    if (ready && S.ui.autoCap && Date.now() > LIVE.cool) {
      LIVE.cool = Date.now() + 2500;
      LIVE.stable = 0;
      const full = cropFrame();
      if (full) handleCanvas(full);
    }
  } catch (e) { console.warn('live', e); } finally { trash.forEach(m => { try { m.delete(); } catch (e) { } }); LIVE.busy = false; }
}

function handleFile(file) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
    handleCanvas(c);
  };
  img.onerror = () => toast('File gambar tidak dapat dibaca', 'err');
  img.src = URL.createObjectURL(file);
}
async function handleCanvas(c) {
  const j = scanJ();
  if (!j) return toast('Pilih paket ujian terlebih dulu', 'err');
  try {
    setBusy(true, 'Memproses lembar jawaban…');
    const a = await analyzeImage(c);
    const fills = readBubbles(a.bin, j.jumlah_soal, j.jumlah_opsi);
    const answers = fills.map(decideRow), warn = [];
    const flat = fills.flat().sort((x, y) => x - y);
    if (flat[flat.length >> 1] > 0.25) warn.push('Banyak bulatan terbaca gelap: periksa bayangan/pencahayaan lalu scan ulang.');
    setResult({ siswaId: S.ui.scanSiswa || '', answers, warp: a.warp, warn });
  } catch (e) { console.error(e); toast(errMsg(e), 'err', 5500); } finally { setBusy(false); }
}
function simulateScan() {
  if (!IS_PREVIEW) return;
  const j = scanJ();
  if (!j) return toast('Pilih paket ujian terlebih dulu', 'err');
  const key = kunciOf(j.id);
  const answers = Array.from({ length: j.jumlah_soal }, (_, i) => Math.random() < 0.18 ? (Math.random() < 0.25 ? '' : LET[Math.floor(Math.random() * j.jumlah_opsi)]) : (key[i] || ''));
  setResult({ siswaId: S.ui.scanSiswa || '', answers, warp: null, warn: ['Mode Simulasi (Preview): jawaban dibuat acak dari kunci jawaban.'] });
}

function setResult(r) {
  const j = scanJ();
  r.key = kunciOf(j.id);
  S.scanR = r;
  renderScanLeft();
  renderResult();
}
function calcScanR() {
  const j = scanJ(), r = S.scanR;
  if (!r || !j || !r.key || !r.key.some(Boolean)) return null;
  const ex = r.siswaId ? D().hasil.find(h => h.jadwal_id === j.id && h.siswa_id === r.siswaId) : null;
  return scoreCombined(r.answers, r.key, ex?.skor_esai || [], j);
}

  const cv2 = $('#ovCanvas');
  if (!cv2 || !r.warp) return;
  cv2.width = G.W; cv2.height = G.H;
  const ctx = cv2.getContext('2d');
  ctx.drawImage(r.warp, 0, 0);
  for (let q = 0; q < j.jumlah_soal; q++) for (let k = 0; k < j.jumlah_opsi; k++) {
    const x = bx(q, k) * G.S, y = by(q) * G.S, L = LET[k], a = r.answers[q], key = r.key ? r.key[q] : null;
    if (a === L || a === '*') {
      ctx.beginPath(); ctx.arc(x, y, G.r * G.S * 0.9, 0, 7);
      ctx.fillStyle = key ? (a === key ? 'rgba(16,185,129,.55)' : 'rgba(244,63,94,.55)') : 'rgba(29,116,245,.5)';
      ctx.fill();
    }
    if (key === L && a !== key) {
      ctx.beginPath(); ctx.arc(x, y, G.r * G.S * 1.15, 0, 7);
      ctx.strokeStyle = '#1D74F5'; ctx.lineWidth = 3; ctx.stroke();
    }
  }
}

function syncManualState(forceReloadStudent = false) {
  const M = S.ui.manual;
  const js = visJadwal();
  if (!M.j && js.length) M.j = js[0].id;
  const j = js.find(x => x.id === M.j);
  if (!j) return null;

  const availKelas = j.kelas_list || [];
  if (M.kelas && !availKelas.includes(M.kelas)) {
    M.kelas = '';
    M.siswa = '';
    forceReloadStudent = true;
  }
  const pool = pesertaJadwal(j)
    .filter(s => !M.kelas || s.kelas === M.kelas)
    .sort((a, b) => (a.kelas || '').localeCompare(b.kelas || '') || a.nama.localeCompare(b.nama));

  if (!M.siswa || !pool.some(s => s.id === M.siswa)) {
    M.siswa = pool[0]?.id || '';
    forceReloadStudent = true;
  }
  if (forceReloadStudent || M.answers.length !== j.jumlah_soal || M.esaiScores.length !== j.jumlah_esai) {
    const ex = M.siswa ? D().hasil.find(h => h.jadwal_id === j.id && h.siswa_id === M.siswa) : null;
    M.answers = Array.from({ length: j.jumlah_soal }, (_, i) => ex?.jawaban?.[i] || '');
    M.esaiScores = Array.from({ length: j.jumlah_esai }, (_, i) => ex?.skor_esai?.[i] ?? 0);
  }
  return { j, availKelas, pool };
}

async function rkExport(kind) {

    : [i + 1, x.s.nis, x.s.nama, x.s.kelas, x.h?.benar ?? '', x.h?.salah ?? '', x.h?.kosong ?? '', x.h ? Number(x.h.nilai) : '', x.h ? (x.h.nilai >= kkm ? 'Tuntas' : 'Remedial') : 'Belum dinilai']

  if (kind === 'xlsx') {
    await guard(async () => {

      const ws = XLSX.utils.aoa_to_sheet([[kopTitle], [`Rekap Nilai ${examLabel(j)} — Kelas ${R.kelas || j.kelas}`], [`KKM ${kkm}`], [], hd, ...data]);

function normalizeKeyChar(ch, maxOpsi) {
  const c = String(ch || '').toUpperCase();
  const mapNum = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', '5': 'E' };
  const letter = mapNum[c] || (LET.includes(c) ? c : '');
  if (!letter) return '';
  return LET.indexOf(letter) < maxOpsi ? letter : '';
}

  const j = D().jadwal.find(x => x.id === id);

function parseSiswaRow(cols) {
  let r = cols.map(c => c.trim());
  if (!r.length) return null;
  const h0 = r[0].toLowerCase();
  if (h0 === 'nis' || h0 === 'no' || h0 === 'nomor') return null;
  // Jika kolom pertama hanya nomor urut 1..3 digit dan kolom >= 5
  if (r.length >= 5 && /^\d{1,3}$/.test(r[0]) && r[1].length >= 4) {
    r = r.slice(1);
  }
  const isGender = v => /^(l|p|laki-laki|perempuan|laki|wanita|pria)$/i.test(String(v || '').trim());
  const normGender = v => /^(p|perempuan|wanita)/i.test(String(v || '').trim()) ? 'P' : 'L';

  let nis = '', nisn = '', nama = '', kelas = '', jk = 'L';
  if (r.length >= 5) {
    nis = r[0];
    nisn = r[1];
    nama = r[2];
    kelas = r[3];
    jk = normGender(r[4]);
  } else if (r.length === 4) {
    if (isGender(r[3])) {
      // Format 4 kolom: NIS ; Nama ; Kelas ; L/P
      nis = r[0];
      nisn = '';
      nama = r[1];
      kelas = r[2];
      jk = normGender(r[3]);
    } else {
      // Format 4 kolom: NIS ; NISN ; Nama ; Kelas
      nis = r[0];
      nisn = r[1];
      nama = r[2];
      kelas = r[3];
    }
  } else if (r.length === 3) {
    // Format 3 kolom: NIS ; Nama ; Kelas
    nis = r[0];
    nisn = '';
    nama = r[1];
    kelas = r[2];
  } else {
    return null;
  }

  if (!nis || !nama || !kelas) return null;
  return { nis, nisn, nama, kelas, jenis_kelamin: jk, aktif: true };
}

function updateBulkPreview(text) {
  if (!S.ui.bulk) return;
  const kind = S.ui.bulk.kind;
  const raw = parseDelimitedText(text);
  let valid = [];
  let skippedDup = 0;

  if (kind === 'siswa') {
    const existingNis = new Set(D().siswa.map(s => String(s.nis || '').trim().toLowerCase()));
    const seenNis = new Set();
    raw.forEach(cols => {
      const parsed = parseSiswaRow(cols);
      if (!parsed) return;
      const key = parsed.nis.toLowerCase();
      if (existingNis.has(key) || seenNis.has(key)) {
        skippedDup++;
        return;
      }
      seenNis.add(key);
      valid.push(parsed);
    });
  } else if (kind === 'guru') {
    const existingUser = new Set(D().guru.map(g => String(g.username || '').trim().toLowerCase()));
    const seenUser = new Set();
    raw.forEach(r => {
      if (r.length < 4 || !r[1] || !r[2] || !r[3] || r[2].toLowerCase() === 'username') return;
      const key = r[2].trim().toLowerCase();
      if (existingUser.has(key) || seenUser.has(key)) { skippedDup++; return; }
      seenUser.add(key);
      valid.push({ nip: r[0] || '', nama: r[1], username: r[2].trim(), password: r[3], aktif: true });
    });
  } else if (kind === 'mapel') {
    const existingMapel = new Set(D().mapel.map(m => String(m.nama || '').trim().toLowerCase()));
    const seenMapel = new Set();
    raw.forEach(r => {
      if (r.length < 1 || !r[0] || r[0].toLowerCase() === 'nama') return;
      const key = r[0].trim().toLowerCase();
      if (existingMapel.has(key) || seenMapel.has(key)) { skippedDup++; return; }
      seenMapel.add(key);
      valid.push({ nama: r[0].trim(), kkm: Number(r[1]) || D().settings.kkm_default || 76 });
    });
  }

  S.ui.bulk.rows = valid;
  S.ui.bulk.skippedDup = skippedDup;

  const btn = $('#bulkSaveBtn');
  if (btn) {
    btn.disabled = valid.length === 0;
    btn.textContent = valid.length ? `Simpan (${valid.length} Baris)` : 'Simpan';
  }
  const prev = $('#bulkPreview');
  if (!prev) return;
  if (!valid.length && !skippedDup) {
    prev.innerHTML = `<p style="font-size:12px;color:var(--muted)">Belum ada baris valid terdeteksi. Pastikan setiap baris berisi minimal 3 kolom (contoh: <code>NIS;Nama;Kelas</code>).</p>`;
    return;
  }
  const sample = valid.slice(0, 6);
  prev.innerHTML = `
    ${skippedDup ? `<div class="warn" style="margin-bottom:6px">${skippedDup} baris dilewati karena NIS / Username / Nama sudah terdaftar atau duplikat.</div>` : ''}
    ${valid.length ? `<div class="info" style="margin-bottom:6px">Terdeteksi <b>${valid.length}</b> baris baru siap disimpan (pratinjau ${sample.length} pertama):</div>
    <div style="font-size:12px;background:var(--bg);padding:8px 12px;border-radius:12px;border:1px solid var(--line);display:grid;gap:3px">
      ${sample.map((r, i) => `<div><b>${i + 1}.</b> ${esc(Object.values(r).filter(v => typeof v !== 'boolean' && v !== '').join(' • '))}</div>`).join('')}
    </div>` : ''}`;
}

async function saveBulkRows() {
  const txtEl = $('#bulkText');
  if (txtEl && S.ui.bulk) updateBulkPreview(txtEl.value);
  const b = S.ui.bulk;
  if (!b || !b.rows || !b.rows.length) {
    return toast('Tidak ada baris data baru yang valid untuk disimpan', 'err');
  }
  const count = b.rows.length;
  const kind = b.kind;
  const rowsToSave = clone(b.rows);
  const ok = await guard(async () => {
    await dbInsert(kind, rowsToSave);
    await reload([kind]);
    return true;
  }, `Menyimpan ${count} data…`);
  if (ok) {
    toast(`${count} data berhasil ditambahkan`);
    S.ui.bulk = null;
    closeModal();
    renderView();
  }
}

    const lines = S.ui.kopDraft;
    const prevHTML = lines.filter(l => l.show !== false && (l.text || '').trim() !== '').map(l =>
      `<div style="font-size:${l.size}pt;font-weight:${l.bold ? 'bold' : 'normal'};font-style:${l.italic ? 'italic' : 'normal'};text-decoration:${l.underline ? 'underline' : 'none'};line-height:1.25">${esc(l.text)}</div>`

        <label class="f"><span>URL Logo Kiri (Kabupaten / Instansi)</span><input class="inp" id="inpLogoKiri" name="logo_kiri" value="${esc(set.logo_kiri || '')}" placeholder="https://.../logo-kiri.png"></label>

        <label class="f"><span>Nama Kepala Sekolah</span><input class="inp" name="kepala_sekolah" value="${esc(set.kepala_sekolah || '')}"></label>
        <label class="f"><span>NIP Kepala Sekolah</span><input class="inp" name="nip_kepala" value="${esc(set.nip_kepala || '')}"></label>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <b style="font-size:13px">Firestore Security Rules (Salin ke Firebase Console → Firestore → Rules)</b>
        <button type="button" class="btn sm ghost" data-act="copyRules">${ic('copy', 14)}Salin Rules</button>
      </div>
      <pre class="codebox" id="rulesBox">${esc(FIRESTORE_RULES_SNIPPET)}</pre>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">Konfigurasi Firebase Project Aktif</h3>
        <button type="button" class="btn sm ghost" data-act="copyCfg">${ic('copy', 14)}Salin Config</button>
      </div>
      <pre class="codebox" id="cfgBox">${esc(JSON.stringify(firebaseConfig, null, 2))}</pre>
    </div>`;
  } else {
    body = `<div class="card">
      <h3>Backup & Restore Data Operasional (JSON)</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Cadangkan seluruh data guru, mata pelajaran, peserta ujian, paket soal, dan hasil koreksi. Proses restore hanya memulihkan data operasional tanpa menimpa pengaturan tampilan.</p>
      <div class="acts">
        <button class="btn" data-act="backup">${ic('download', 16)}Unduh File Backup (.json)</button>
        <label class="btn ghost">${ic('upload', 16)}Pulihkan dari Backup (.json)<input type="file" accept=".json" hidden data-bind="restore"></label>
      </div>
    </div>`;
  }

  return head('Pengaturan Sistem', 'Konfigurasi tampilan, kop surat sekolah, integrasi Firebase, dan cadangan data', '') + tabs + body;
}

/* ===================== RENDER UTAMA & NAVIGASI ===================== */
function viewHTML() {
  const m = myMenu();
  if (!m.some(x => x.id === S.page)) S.page = 'dashboard';
  const map = {
    dashboard: pgDashboard,
    master: pgMaster,
    siswa: pgSiswa,
    jadwal: pgJadwal,
    scan: pgScan,
    manual: pgManual,
    rekap: pgRekap,
    pengaturan: pgPengaturan
  };
  return (map[S.page] || pgDashboard)();
}

function renderView() {
  if (S.page !== 'scan') stopCam();
  const c = $('#view');
  if (!c) return;
  c.innerHTML = viewHTML();
  if (S.page === 'scan') {
    renderScanLeft();
    renderResult();
  }
  const railSlot = $('#railSlot');
  if (railSlot) railSlot.innerHTML = S.page === 'dashboard' ? railView() : '';
  $$('[data-act=go]').forEach(b => b.classList.toggle('on', b.dataset.p === S.page));
  $('#studioSlot').innerHTML = renderStudioOverlay();
}

function render() {
  if (!S.user) {
    $('#root').innerHTML = loginView();
    return;
  }
  const m = myMenu();
  const set = D().settings;
  const hasLogo = Boolean((set.logo_kiri || '').trim());
  const js = visJadwal(), ids = new Set(js.map(j => j.id));
  const totalTerkoreksi = D().hasil.filter(h => ids.has(h.jadwal_id)).length;

  let navHTML = '';
  let lastGrp = '';
  m.forEach(x => {
    if (x.grp !== lastGrp) {
      lastGrp = x.grp;
      navHTML += `<div class="nav-grp">${esc(x.grp)}</div>`;
    }
    navHTML += `<button class="nav ${x.id === S.page ? 'on' : ''}" data-act="go" data-p="${x.id}" title="${esc(x.label)}">${ic(x.icon, 18)}<span>${esc(x.label)}</span></button>`;

    <aside class="side ${S.ui.sideMin ? 'min' : ''}">
      <div class="brand">
        <div class="logo">${hasLogo ? `<img src="${esc(set.logo_kiri)}" alt="Logo">` : ic('scan-line', 20)}</div>

      <div class="side-foot">
        <div class="side-user">
          <div class="av">${ic(S.user.role === 'admin' ? 'shield-check' : 'user', 16)}</div>
          <div class="side-user-info">
            <b>${esc(S.user.nama)}</b>
            <small>${roleLabel}</small>
          </div>
        </div>
        <button class="logout-btn" data-act="logout" title="Keluar">${ic('log-out', 16)}<span>Keluar</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <div class="search">${ic('search', 16)}<input placeholder="Cari nama siswa, NIS, kelas, atau guru…" value="${esc(S.q)}" data-bind="q"></div>
        <div class="tr">
          <div class="status-chip">${ic('check-circle', 16)} <span>${totalTerkoreksi} Terkoreksi</span></div>
          <button class="ib" data-act="notif" title="Ringkasan Status">${ic('bell', 18)}${js.some(j => j.status !== 'selesai') ? '<i class="dot"></i>' : ''}</button>

      <button class="cen" data-act="go" data-p="scan" title="Scan LJK">${ic('scan-line', 22)}</button>

/* ===================== HANDLER EVENT DELEGASI ===================== */
$('#ljkApp').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const { act } = b.dataset;

  if (act === 'role') { S.ui.lrole = b.dataset.r; render(); }
  else if (act === 'toggleLoginPw') {
    S.ui.showLoginPw = !S.ui.showLoginPw;
    const inp = $('#loginPwInp');
    if (inp) inp.type = S.ui.showLoginPw ? 'text' : 'password';
    b.innerHTML = ic(S.ui.showLoginPw ? 'eye-off' : 'eye', 16);
  }
  else if (act === 'go') { S.page = b.dataset.p; closeModal(); renderView(); }
  else if (act === 'sideMin') { S.ui.sideMin = !S.ui.sideMin; $('.side')?.classList.toggle('min', S.ui.sideMin); b.innerHTML = ic(S.ui.sideMin ? 'chevron-right' : 'chevron-left', 16); }
  else if (act === 'logout') logout();
  else if (act === 'closeModal') closeModal();
  else if (act === 'copyStr') copyText(b.dataset.v || '');
  else if (act === 'copyRules') copyText($('#rulesBox')?.textContent || FIRESTORE_RULES_SNIPPET);
  else if (act === 'copyCfg') copyText($('#cfgBox')?.textContent || JSON.stringify(firebaseConfig, null, 2));
  else if (act === 'more') {
    openModal(`<div class="mh"><h3 style="margin:0">Semua Menu</h3><button class="btn sm ghost ico-b" data-act="closeModal">${ic('x', 16)}</button></div><div class="more">${myMenu().map(x => `<button data-act="go" data-p="${x.id}">${ic(x.icon, 18)}${x.label}</button>`).join('')}<button style="color:var(--rose)" data-act="logout">${ic('log-out', 18)}Keluar</button></div>`);
  }
  else if (act === 'notif') {
    const js = visJadwal(), un = js.filter(j => !kunciOf(j.id).some(Boolean));
    openModal(`<div class="mh"><h3 style="margin:0">Info & Notifikasi</h3><button class="btn sm ghost ico-b" data-act="closeModal">${ic('x', 16)}</button></div><p>${js.length} paket ujian • ${D().hasil.length} lembar jawaban terkoreksi</p>${un.length ? `<div class="warn" style="margin-top:10px">${un.length} paket belum diisi kunci PG: ${un.map(j => esc(j.nama_ujian)).join(', ')}</div>` : '<p style="color:#047857;margin-top:8px;font-weight:600">Semua paket ujian telah memiliki kunci jawaban.</p>'}`);
  }
  else if (act === 'pg') { S.ui.pg[b.dataset.k] = +b.dataset.p; renderView(); }
  else if (act === 'scanExam') {
    S.ui.scanJ = b.dataset.id;
    S.ui.scanKelas = '';
    S.ui.scanSiswa = '';
    S.scanR = null;
    S.page = 'scan';
    renderView();
  }

  /* Studio Cetak LJK Universal */
  else if (act === 'studioOpen') {
    S.ui.studio.open = true;
    $('#studioSlot').innerHTML = renderStudioOverlay();
  }
  else if (act === 'studioOpenExam') {
    const j = D().jadwal.find(x => x.id === b.dataset.id);
    if (j) {
      S.ui.studio.judul = `LJK ${j.nama_ujian.toUpperCase()}${j.kode_paket ? ' (' + j.kode_paket + ')' : ''}`;
      S.ui.studio.maxPg = j.jumlah_soal;
      S.ui.studio.opsi = j.jumlah_opsi;
      S.ui.studio.esaiOn = j.jumlah_esai > 0;
      S.ui.studio.esaiCount = Math.max(3, j.jumlah_esai || 5);
    }
    S.ui.studio.open = true;
    $('#studioSlot').innerHTML = renderStudioOverlay();
  }
  else if (act === 'studioClose') {
    S.ui.studio.open = false;
    $('#studioSlot').innerHTML = '';
  }
  else if (act === 'studioSet') {
    const { k, v } = b.dataset;
    S.ui.studio[k] = k === 'perSheet' ? Number(v) : v;
    $('#studioSlot').innerHTML = renderStudioOverlay();
  }
  else if (act === 'studioZoom') {
    S.ui.studio.zoom = Math.max(70, Math.min(130, (S.ui.studio.zoom || 100) + Number(b.dataset.d)));
    $('#studioSlot').innerHTML = renderStudioOverlay();
  }
  else if (act === 'studioPrint') executeStudioPrint();

  /* Scan LJK */
  else if (act === 'scanMode') {
    S.ui.scanMode = b.dataset.m;
    S.scanR = null;
    renderScanLeft();
    renderResult();
    if (S.ui.scanMode === 'cam') startCam();
  }
  else if (act === 'camStart') startCam();
  else if (act === 'camSnap') snap();
  else if (act === 'autoToggle') {
    S.ui.autoCap = !S.ui.autoCap;
    const ab = $('#autoBtn');
    if (ab) ab.textContent = S.ui.autoCap ? 'Auto-ambil: ON' : 'Auto-ambil: OFF';
  }
  else if (act === 'simScan') simulateScan();
  else if (act === 'scanBub') {
    const q = +b.dataset.q, L = b.dataset.l;
    S.scanR.answers[q] = S.scanR.answers[q] === L ? '' : L;
    refreshResult();
  }
  else if (act === 'scanCancel') {
    S.scanR = null;
    LIVE.cool = Date.now() + 1800;
    LIVE.stable = 0;
    renderScanLeft();
    renderResult();
    if (S.ui.scanMode === 'cam') startCam();
  }
  else if (act === 'scanSave') await saveResult();

  /* Periksa Manual (PG & Esai) */
  else if (act === 'manBub') {
    const q = +b.dataset.q, L = b.dataset.l;
    S.ui.manual.answers[q] = S.ui.manual.answers[q] === L ? '' : L;
    const inp = $('#manPastePG');
    if (inp) inp.value = S.ui.manual.answers.map(x => x || '-').join('').replace(/-+$/, '');
    refreshManualCards();
  }
  else if (act === 'manClearPG') {
    S.ui.manual.answers.fill('');
    const inp = $('#manPastePG');
    if (inp) inp.value = '';
    refreshManualCards();
  }
  else if (act === 'manFullEsai') {
    const j = visJadwal().find(x => x.id === S.ui.manual.j);
    if (!j) return;
    S.ui.manual.esaiScores = (j.skor_maks_esai || []).map(v => Number(v) || 10);
    renderView();
  }
  else if (act === 'manSave') await saveManualResult();

  /* Master & Paket & Kunci */
  else if (act === 'masterTab') { S.ui.masterTab = b.dataset.t; renderView(); }
  else if (act === 'guruForm') guruForm(b.dataset.id);
  else if (act === 'guruBulk') guruBulkModal();
  else if (act === 'mapelForm') mapelForm(b.dataset.id);
  else if (act === 'mapelBulk') mapelBulkModal();
  else if (act === 'siswaForm') siswaForm(b.dataset.id);
  else if (act === 'siswaBulk') siswaBulkModal();
  else if (act === 'bulkSave') await saveBulkRows();
  else if (act === 'siswaTpl') download('template_peserta.csv', 'nis;nisn;nama;kelas;jenis_kelamin\n252609001;0081234501;Ahmad Fauzan;9A;L\n252609002;0081234502;Siti Nurhaliza;9A;P\n');
  else if (act === 'jadwalForm') jadwalForm(b.dataset.id);

  else if (act === 'toggleFormKelas') {
    const k = b.dataset.k;
    const idx = S.ui.formKelasSel.indexOf(k);
    if (idx >= 0) S.ui.formKelasSel.splice(idx, 1);
    else S.ui.formKelasSel.push(k);
    b.classList.toggle('on', S.ui.formKelasSel.includes(k));
  }
  else if (act === 'addFormKelas') {
    const inp = $('#newKelasInp');
    const val = (inp?.value || '').trim().toUpperCase();
    if (!val) return;
    if (!S.ui.formKelasSel.includes(val)) S.ui.formKelasSel.push(val);
    inp.value = '';
    const box = $('#clsBtnBox');
    if (box && !$$('.cls-btn', box).some(btn => btn.dataset.k === val)) {
      if (box.querySelector('small')) box.innerHTML = '';
      const nb = document.createElement('button');
      nb.type = 'button';
      nb.className = 'cls-btn on';
      nb.dataset.act = 'toggleFormKelas';
      nb.dataset.k = val;
      nb.textContent = val;
      box.appendChild(nb);
    } else {
      $$('.cls-btn', box).forEach(btn => { if (btn.dataset.k === val) btn.classList.add('on'); });
    }
  }

  else if (act === 'jdOpen') jdOpen(b.dataset.id);
  else if (act === 'jdBub') {
    const q = +b.dataset.q, L = b.dataset.l;
    S.ui.jd.arr[q] = S.ui.jd.arr[q] === L ? '' : L;
    jdRender();
  }
  else if (act === 'jdClear') { S.ui.jd.arr.fill(''); jdRender(); }
  else if (act === 'jdCopySum') copyText($('#jdSumRaw')?.value || '');
  else if (act === 'jdSave') await jdSave();

  /* Rekap & Pengaturan */
  else if (act === 'rkMode') { S.ui.rekap.mode = b.dataset.m; renderView(); }
  else if (act === 'rkDetail') rkDetail(b.dataset.id);
  else if (act === 'rkXlsx') await rkExport('xlsx');
  else if (act === 'rkPrint') await rkExport('print');

  else if (act === 'setTab') { S.ui.setTab = b.dataset.t; renderView(); }
  else if (act === 'pickColor') {
    const c = b.dataset.c;
    const inp = $('#themeColorInp');
    if (inp) inp.value = c;
  }
  else if (act === 'kopToggle') {
    const i = +b.dataset.i, f = b.dataset.f;
    const cur = S.ui.kopDraft[i];
    cur[f] = f === 'show' ? (cur.show === false ? true : false) : !cur[f];
    renderView();
  }
  else if (act === 'kopMove') {
    const i = +b.dataset.i, d = +b.dataset.d, ni = i + d;
    if (ni >= 0 && ni < S.ui.kopDraft.length) {
      const tmp = S.ui.kopDraft[i];
      S.ui.kopDraft[i] = S.ui.kopDraft[ni];
      S.ui.kopDraft[ni] = tmp;
      renderView();
    }
  }
  else if (act === 'kopAdd') {
    S.ui.kopDraft.push({ text: 'BARIS KOP BARU', size: 10, bold: false, italic: false, underline: false, show: true });
    renderView();
  }
  else if (act === 'kopDel') {
    const i = +b.dataset.i;
    if (S.ui.kopDraft.length > 1) {
      S.ui.kopDraft.splice(i, 1);
      renderView();
    }
  }
  else if (act === 'backup') {
    download('backup_scan_ljk_' + todayISO() + '.json', JSON.stringify({
      exported_at: new Date().toISOString(),
      users: D().guru,
      mata_pelajaran: D().mapel,
      peserta_ujian: D().siswa,
      ujian_sas: D().jadwal,
      hasil_koreksi: D().hasil
    }, null, 2), 'application/json');
  }
  else if (act === 'del') {
    if (!(await confirmBox('Data yang dihapus tidak dapat dikembalikan. Lanjutkan?'))) return;
    const { k, id } = b.dataset;
    const ok = await guard(async () => { await dbDelete(k, id); await reload([k, 'hasil']); return true; }, 'Menghapus data…');
    if (ok) { toast('Data dihapus'); renderView(); }
  }
});

$('#ljkApp').addEventListener('change', async e => {
  const el = e.target, b = el.dataset.bind;
  if (el.id === 'bulkText') {
    updateBulkPreview(el.value);
    return;
  }
  if (el.dataset.esaiIdx !== undefined) {
    const idx = +el.dataset.esaiIdx;
    const j = visJadwal().find(x => x.id === S.ui.manual.j);
    const maks = Number(j?.skor_maks_esai?.[idx]) || 100;
    S.ui.manual.esaiScores[idx] = Math.max(0, Math.min(maks, Number(el.value) || 0));
    el.value = S.ui.manual.esaiScores[idx];
    refreshManualCards();
    return;
  }
  if (el.dataset.kopF) {
    const i = +el.dataset.i, f = el.dataset.kopF;
    S.ui.kopDraft[i][f] = f === 'size' ? (+el.value || 10) : el.value;
    renderView();
    return;
  }
  if (!b) return;
  if (b === 'dashJ') { S.ui.dashJ = el.value; renderView(); }
  else if (b === 'kelasF') { S.ui.kelasF = el.value; S.ui.pg.siswa = 1; renderView(); }
  else if (b === 'pgSize') { S.ui.pgSize[el.dataset.k] = +el.value; S.ui.pg[el.dataset.k] = 1; renderView(); }
  else if (b === 'scanJ') { S.ui.scanJ = el.value; S.ui.scanKelas = ''; S.ui.scanSiswa = ''; S.scanR = null; renderView(); }
  else if (b === 'scanKelas') { S.ui.scanKelas = el.value; S.ui.scanSiswa = ''; renderView(); }
  else if (b === 'scanSiswa') { S.ui.scanSiswa = el.value; if (S.scanR) { S.scanR.siswaId = el.value; refreshResult(); } else renderResult(); }
  else if (b === 'scanFile') { S.ui.scanMode = 'file'; handleFile(el.files[0]); el.value = ''; }

  else if (b === 'manJ') { S.ui.manual.j = el.value; S.ui.manual.kelas = ''; S.ui.manual.siswa = ''; syncManualState(true); renderView(); }
  else if (b === 'manKelas') { S.ui.manual.kelas = el.value; S.ui.manual.siswa = ''; syncManualState(true); renderView(); }
  else if (b === 'manSiswa') { S.ui.manual.siswa = el.value; syncManualState(true); renderView(); }

  else if (b === 'studioPgOn') { S.ui.studio.pgOn = el.checked; $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioCols') { S.ui.studio.cols = Math.max(1, Math.min(5, +el.value || 5)); $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioRows') { S.ui.studio.rows = Math.max(1, Math.min(25, +el.value || 10)); $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioMaxPg') { S.ui.studio.maxPg = Math.max(1, Math.min(50, +el.value || 50)); $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioEsaiOn') { S.ui.studio.esaiOn = el.checked; $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioEsaiCount') { S.ui.studio.esaiCount = Math.max(1, Math.min(15, +el.value || 5)); $('#studioSlot').innerHTML = renderStudioOverlay(); }

  else if (b === 'rkJ') { S.ui.rekap.j = el.value; S.ui.rekap.kelas = ''; S.ui.pg.rekap = 1; renderView(); }
  else if (b === 'rkKelas') { S.ui.rekap.kelas = el.value; S.ui.rekap.siswa = ''; S.ui.pg.rekap = 1; renderView(); }
  else if (b === 'rkSiswa') { S.ui.rekap.siswa = el.value; renderView(); }

  else if (b === 'siswaCsv') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const raw = parseDelimitedText(await f.text());
    const existingNis = new Set(D().siswa.map(s => String(s.nis || '').trim().toLowerCase()));
    const rows = [];
    raw.forEach(cols => {
      const p = parseSiswaRow(cols);
      if (p && !existingNis.has(p.nis.toLowerCase())) {
        existingNis.add(p.nis.toLowerCase());
        rows.push(p);
      }
    });
    if (!rows.length) return toast('CSV peserta tidak valid atau semua NIS sudah terdaftar.', 'err', 4500);
    const ok = await guard(async () => { await dbInsert('siswa', rows); await reload(['siswa']); return true; }, `Mengimpor ${rows.length} peserta…`);
    if (ok) { toast(`${rows.length} peserta diimpor`); renderView(); }
  }
  else if (b === 'guruCsv') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const raw = parseDelimitedText(await f.text());
    const rows = raw.filter(r => r.length >= 4 && r[1] && r[2] && r[3] && r[2].toLowerCase() !== 'username')
      .map(r => ({ nip: r[0] || '', nama: r[1], username: r[2], password: r[3], aktif: true }));
    if (!rows.length) return toast('CSV guru tidak valid. Format: nip;nama;username;password', 'err', 4500);
    const ok = await guard(async () => { await dbInsert('guru', rows); await reload(['guru']); return true; }, `Mengimpor ${rows.length} guru…`);
    if (ok) { toast(`${rows.length} guru diimpor`); renderView(); }
  }
  else if (b === 'mapelCsv') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const raw = parseDelimitedText(await f.text());
    const rows = raw.filter(r => r.length >= 1 && r[0] && r[0].toLowerCase() !== 'nama')
      .map(r => ({ nama: r[0], kkm: Number(r[1]) || D().settings.kkm_default || 76 }));
    if (!rows.length) return toast('CSV mapel tidak valid. Format: nama;kkm', 'err', 4500);
    const ok = await guard(async () => { await dbInsert('mapel', rows); await reload(['mapel']); return true; }, `Mengimpor ${rows.length} mapel…`);
    if (ok) { toast(`${rows.length} mata pelajaran diimpor`); renderView(); }
  }
  else if (b === 'restore') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    if (!(await confirmBox('Pulihkan data dari file backup ini? Pengaturan tampilan tidak akan ditimpa.', 'Pulihkan'))) return;
    const ok = await guard(async () => {
      const o = JSON.parse(await f.text());
      const strip = r => { const x = { ...r }; delete x.id; return x; };
      for (const [jsonKey, appKey] of [['users', 'guru'], ['mata_pelajaran', 'mapel'], ['peserta_ujian', 'siswa'], ['ujian_sas', 'jadwal'], ['hasil_koreksi', 'hasil']]) {
        const list = o[jsonKey] || [];
        if (list.length) await dbInsert(appKey, list.map(strip));
      }
      await reload(['guru', 'mapel', 'siswa', 'jadwal', 'hasil']);
      return true;
    }, 'Memulihkan data…');
    if (ok) { toast('Data operasional berhasil dipulihkan'); renderView(); }
  }
});

$('#ljkApp').addEventListener('paste', e => {
  if (e.target.id === 'bulkText') {
    setTimeout(() => updateBulkPreview(e.target.value), 10);
  }
});

$('#ljkApp').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind === 'q') { S.q = el.value; S.ui.pg = {}; renderView(); }
  else if (el.id === 'pasteKey' && S.ui.jd) {
    const j = D().jadwal.find(x => x.id === S.ui.jd.id);
    const raw = el.value.toUpperCase();
    for (let i = 0; i < S.ui.jd.arr.length; i++) {
      S.ui.jd.arr[i] = normalizeKeyChar(raw[i], j.jumlah_opsi);
    }
    jdRender();
    const nInp = $('#pasteKey');
    if (nInp) { nInp.focus(); nInp.setSelectionRange(raw.length, raw.length); }
  }
  else if (el.id === 'manPastePG') {
    const j = visJadwal().find(x => x.id === S.ui.manual.j);
    if (!j) return;
    const raw = el.value.toUpperCase();
    for (let i = 0; i < S.ui.manual.answers.length; i++) {
      S.ui.manual.answers[i] = normalizeKeyChar(raw[i], j.jumlah_opsi);
    }
    refreshManualCards();
  }
  else if (el.id === 'bulkText') {
    updateBulkPreview(el.value);
  }
  else if (el.id === 'fNamaUjian') {
    const m = D().mapel.find(x => (x.nama || '').toLowerCase() === el.value.trim().toLowerCase());
    const kkmInp = $('#fKkmUjian');
    if (m && kkmInp) kkmInp.value = m.kkm ?? 76;
  }
  else if (el.id === 'fJmlEsai') {
    const nEsai = Math.max(0, Number(el.value) || 0);
    const bp = $('#fBobotPg');
    if (bp) bp.value = nEsai === 0 ? 100 : (Number(bp.value) === 100 ? 80 : bp.value);
  }
});

$('#ljkApp').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, v = Object.fromEntries(new FormData(f));

  if (kind === 'login') {
    const ok = await guard(async () => {
      if (S.ui.lrole === 'admin') await loginAdmin(v.u, v.p);
      else await loginGuru(v.u, v.p);
      await loadAll();
      return true;
    }, 'Memeriksa kredensial & memuat data…');
    if (ok) render();
  }
  else if (kind === 'guru') {
    const row = { nip: v.nip.trim(), nama: v.nama.trim(), username: v.username.trim(), password: v.password, aktif: !!v.aktif };
    const ok = await guard(async () => {
      if (v.id) await dbUpdate('guru', v.id, row);
      else await dbInsert('guru', [row]);
      await reload(['guru']);
      return true;
    }, 'Menyimpan guru…');
    if (ok) { toast('Data guru tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'mapel') {
    const row = { nama: v.nama.trim(), kkm: +v.kkm };
    const ok = await guard(async () => {
      if (v.id) await dbUpdate('mapel', v.id, row);
      else await dbInsert('mapel', [row]);
      await reload(['mapel']);
      return true;
    }, 'Menyimpan mata pelajaran…');
    if (ok) { toast('Mata pelajaran tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'siswa') {
    const row = { nis: v.nis.trim(), nisn: v.nisn.trim(), nama: v.nama.trim(), kelas: v.kelas.trim(), jenis_kelamin: v.jenis_kelamin, aktif: !!v.aktif };
    const ok = await guard(async () => {
      if (v.id) await dbUpdate('siswa', v.id, row);
      else await dbInsert('siswa', [row]);
      await reload(['siswa']);
      return true;
    }, 'Menyimpan peserta…');
    if (ok) { toast('Data peserta tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'jadwal') {
    const kelas_list = [...S.ui.formKelasSel].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
    if (!kelas_list.length) return toast('Pilih minimal satu kelas peserta ujian', 'err');
    const nEsai = Math.max(0, Math.min(20, +v.jumlah_esai || 0));
    const bobotPg = nEsai === 0 ? 100 : Math.max(0, Math.min(100, +v.bobot_pg || 80));
    const bobotEsai = nEsai === 0 ? 0 : (100 - bobotPg);
    const skorPerEsai = Math.max(1, Number(v.skor_per_esai) || 20);
    const row = {
      kode_paket: (v.kode_paket || '').trim(),
      nama_ujian: v.nama_ujian.trim(),
      kkm: +v.kkm,
      guru_id: v.guru_id || null,
      kelas_list,
      kelas: kelas_list.join(', '),
      jumlah_soal: +v.jumlah_soal,
      jumlah_opsi: +v.jumlah_opsi,
      bobot_pg: bobotPg,
      jumlah_esai: nEsai,
      bobot_esai: bobotEsai,
      skor_maks_esai: Array.from({ length: nEsai }, () => skorPerEsai),
      status: v.status
    };
    const ok = await guard(async () => {
      if (v.id) {
        const old = D().jadwal.find(x => x.id === v.id);
        if (old && Array.isArray(old.kunci)) row.kunci = old.kunci.slice(0, row.jumlah_soal);
        await dbUpdate('jadwal', v.id, row);
      } else {
        row.kunci = [];
        await dbInsert('jadwal', [row]);
      }
      await reload(['jadwal']);
      return true;
    }, 'Menyimpan paket ujian…');
    if (ok) { toast('Paket ujian tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'settingsTampilan') {
    const patch = {
      app_name: v.app_name.trim() || DEFAULT_SETTINGS.app_name,
      app_subtitle: v.app_subtitle.trim() || DEFAULT_SETTINGS.app_subtitle,
      login_title: v.login_title.trim() || DEFAULT_SETTINGS.login_title,
      login_subtitle: v.login_subtitle.trim() || DEFAULT_SETTINGS.login_subtitle,
      hero_greeting: v.hero_greeting.trim() || DEFAULT_SETTINGS.hero_greeting,
      hero_desc: v.hero_desc.trim() || DEFAULT_SETTINGS.hero_desc,
      hero_cta: v.hero_cta.trim() || DEFAULT_SETTINGS.hero_cta,
      theme_color: v.theme_color || '#1D74F5'
    };
    const ok = await guard(async () => { await dbSetSettings(patch); await reload(['settings']); return true; }, 'Menyimpan tampilan…');
    if (ok) { toast('Pengaturan tampilan tersimpan'); render(); }
  }
  else if (kind === 'settingsKop') {
    const patch = {
      logo_kiri: v.logo_kiri.trim(),
      logo_kanan: v.logo_kanan.trim(),
      kop_lines: clone(S.ui.kopDraft || DEFAULT_KOP_LINES),
      kota: v.kota.trim(),
      kepala_sekolah: v.kepala_sekolah.trim(),
      nip_kepala: v.nip_kepala.trim(),
      kkm_default: +v.kkm_default
    };
    const ok = await guard(async () => { await dbSetSettings(patch); await reload(['settings']); return true; }, 'Menyimpan kop surat…');
    if (ok) { toast('Pengaturan kop surat & LJK tersimpan'); S.ui.kopDraft = null; render(); }
  }
});

/* ===================== INISIALISASI PWA & BOOTSTRAP ===================== */
function registerDynamicSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const swCode = `const CACHE='scan-ljk-v4';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});`;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => { });
  } catch (e) { }
}

async function boot() {
  registerDynamicSW();
  applyTheme();
  if (IS_PREVIEW) {
    seedDummyPreview();
    await loadAll();
    render();
    return;
  }
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    try { await reload(['settings']); } catch (e) { }
    onAuthStateChanged(auth, async u => {
      if (u && (!S.user || S.user.role === 'admin')) {
        S.user = { role: 'admin', id: u.uid, nama: formatAdminName(u.email), email: u.email };
        await guard(() => loadAll(), 'Memuat data dari Firestore…');
        render();
      } else if (!u && S.user?.role === 'admin') {
        S.user = null;
        render();
      } else {
        render();
      }
    });
  } catch (e) {
    S.setupError = 'Gagal menginisialisasi Firebase: ' + errMsg(e);
    render();
  }
}

boot();
