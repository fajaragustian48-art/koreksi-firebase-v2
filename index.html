/* ===================== DESIGN SYSTEM & TOKENS ===================== */
#ljkApp {

/* ===================== 3-COLUMN APP SHELL ===================== */

}

/* Left Fixed & Collapsible Sidebar */

  flex-direction: column;

}

}

  padding: 3px;
}
#ljkApp .brand-txt { min-width: 0; flex: 1; }
#ljkApp .brand-txt b {
  display: block;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ljkApp .brand-txt small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ljkApp .side.min .brand-txt { display: none; }
#ljkApp .col-btn {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: var(--pill);
  color: var(--muted);
  display: grid;
  place-items: center;

#ljkApp .nav-list {

#ljkApp .nav {

/* Center Main Workspace & Modern Header Search */

  overflow-x: hidden;

  padding: 18px 24px 36px;

}

  display: flex;

  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
#ljkApp .search {
  flex: 1;
  min-width: 180px;
  max-width: 460px;

  gap: 9px;

  border: 1px solid var(--line);

  color: var(--ink);

}

#ljkApp .ib {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  position: relative;

}
#ljkApp .ib:hover { background: var(--pri-soft); color: var(--pri); }

  width: 8px;
  height: 8px;

}

/* Right Utility & Stats Rail */
#ljkApp .rail {

/* ===================== HERO BANNER & DASHBOARD CARDS ===================== */
#ljkApp .hero {

#ljkApp .sec {

#ljkApp .sec h2, #ljkApp .sec h3 { font-size: 15.5px; font-weight: 700; }
#ljkApp .link { font-size: 12px; font-weight: 700; color: var(--pri); }

#ljkApp .active-card {

#ljkApp .pbar {

#ljkApp .pbar i {
  display: block;
  height: 100%;
  border-radius: 999px;

}

}
#ljkApp .pcard b { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); }

  if (loadedScripts[url]) return loadedScripts[url];
  loadedScripts[url] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => res();
    s.onerror = () => { delete loadedScripts[url]; rej(new Error('Gagal memuat pustaka eksternal.')); };
    document.head.appendChild(s);
  });
  return loadedScripts[url];

function download(filename, content, mime = 'text/csv;charset=utf-8;') {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function parseDelimitedText(text) {
  const lines = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim() !== '');
  return lines.map(line => {
    const sep = line.includes('\t') ? '\t' : (line.includes(';') ? ';' : ',');
    return line.split(sep).map(c => c.replace(/^["']|["']$/g, '').trim());
  });
}

function copyText(str) {
  try {
    const ta = document.createElement('textarea');
    ta.value = str;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('Teks berhasil disalin ke clipboard');

  }
}

    wrap.className = 'toast-wrap';
    slot.appendChild(wrap);
  }
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.innerHTML = `${ic(type === 'err' ? 'alert-triangle' : 'check-circle', 16)}<span>${esc(msg)}</span>`;

  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '0.25s'; setTimeout(() => el.remove(), 260); }, ms);
}

  if (code === 'permission-denied') return 'Akses Firestore ditolak. Periksa Firestore Security Rules Anda.';
  return e.message || String(e);
}

function ic(name, size = 18) {
  const body = ICONS[name] || ICONS['scan-line'];
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}

const ICON_PRESETS = {
  system: ['scan-line', 'clipboard-check', 'book-open', 'award', 'sparkles', 'layout-grid', 'shield-check', 'check-circle'],
  user: ['user', 'user-check', 'user-cog', 'book-open', 'file-edit', 'award', 'users', 'sparkles'],

};

function renderConfiguredIcon(kind, cls, size = 18) {
  const set = D().settings;
  const defMap = {
    system: { icon: 'scan-line', color: '#FFFFFF', bg: '#1D74F5', trans: false },
    user: { icon: 'user', color: '#1D74F5', bg: '#EFF6FF', trans: false },
    admin: { icon: 'shield-check', color: '#1D74F5', bg: '#EFF6FF', trans: false }
  };
  const d = defMap[kind] || defMap.system;
  const val = (set[`icon_${kind}`] || d.icon).trim();
  const color = set[`icon_${kind}_color`] || d.color;
  const trans = Boolean(set[`icon_${kind}_transparent`]);
  const bg = trans ? 'transparent' : (set[`icon_${kind}_bg`] || d.bg);
  const inner = isImageUrl(val)
    ? `<img src="${esc(val)}" alt="${kind}">`
    : ic(ICONS[val] ? val : d.icon, size);
  return `<div class="${cls}" style="background:${esc(bg)};color:${esc(color)}">${inner}</div>`;
}

    const b = parseInt(hex.slice(5, 7), 16);
    const dark = '#' + [r, g, b].map(v => Math.max(0, Math.round(v * 0.82)).toString(16).padStart(2, '0')).join('');

function uniqueCheck(key, r) {
  const t = COL[key];
  const dup = f => MEM[t].some(x => String(x[f] || '').toLowerCase() === String(r[f] || '').toLowerCase() && x.id !== r.id);
  if ((key === 'guru' && dup('username')) || (key === 'siswa' && dup('nis')) || (key === 'mapel' && dup('nama'))) {
    throw new Error('Data duplikat: NIS, username, atau nama mata pelajaran sudah terdaftar.');
  }
}

async function dbAll(key) {
  const t = COL[key];
  if (IS_PREVIEW) return clone(MEM[t]);
  const snap = await getDocs(collection(db, t));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function dbInsert(key, rows) {
  const t = COL[key];
  const arr = Array.isArray(rows) ? rows : [rows];
  if (IS_PREVIEW) {
    const out = arr.map(r => ({ id: uid(), created_at: new Date().toISOString(), ...r }));
    out.forEach(r => uniqueCheck(key, r));
    MEM[t].push(...out);
    return clone(out);
  }
  const out = [];
  const chunkSize = 25;
  for (let i = 0; i < arr.length; i += chunkSize) {
    const slice = arr.slice(i, i + chunkSize);
    const saved = await Promise.all(slice.map(async r => {
      const payload = { created_at: new Date().toISOString(), ...r };
      const ref = await addDoc(collection(db, t), payload);
      return { id: ref.id, ...payload };
    }));
    out.push(...saved);
  }
  return out;
}

async function dbUpdate(key, id, patch) {
  const t = COL[key];
  if (IS_PREVIEW) {
    const r = MEM[t].find(x => x.id === id);
    if (!r) throw new Error('Data tidak ditemukan');
    uniqueCheck(key, { ...r, ...patch });
    Object.assign(r, patch);
    return;
  }
  await updateDoc(doc(db, t, id), patch);
}

async function dbSetSettings(patch) {
  if (IS_PREVIEW) {

  }

}

async function dbDelete(key, id) {
  const t = COL[key];
  if (IS_PREVIEW) {
    MEM[t] = MEM[t].filter(x => x.id !== id);
    if (key === 'jadwal') MEM.hasil_koreksi = MEM.hasil_koreksi.filter(x => x.jadwal_id !== id);
    if (key === 'siswa') MEM.hasil_koreksi = MEM.hasil_koreksi.filter(x => x.siswa_id !== id);
    if (key === 'guru') MEM.ujian_sas.forEach(j => { if (j.guru_id === id) j.guru_id = null; });
    return;
  }
  await deleteDoc(doc(db, t, id));
}

async function dbClearCollection(key) {
  const t = COL[key];
  if (IS_PREVIEW) {
    MEM[t] = [];
    return;
  }
  const snap = await getDocs(collection(db, t));
  const docs = snap.docs;
  const chunkSize = 25;
  for (let i = 0; i < docs.length; i += chunkSize) {
    await Promise.all(docs.slice(i, i + chunkSize).map(d => deleteDoc(doc(db, t, d.id))));
  }
}

function decorate() {
  S.data.mapel.forEach(m => {
    if (!m.nama && m.mapel) m.nama = m.mapel;
    if (m.kkm === undefined || m.kkm === null) m.kkm = D().settings.kkm_default ?? 76;
  });
  S.data.siswa.forEach(s => {
    if (!s.kelas && s.kelas_id) {
      const m = S.data.mapel.find(x => x.id === s.kelas_id);
      s.kelas = m?.nama || '';
    }
    s.kelas = String(s.kelas || '').trim();
  });
  S.data.jadwal.forEach(j => {
    if (!Array.isArray(j.kelas_list)) {
      j.kelas_list = j.kelas ? String(j.kelas).split(',').map(x => x.trim()).filter(Boolean) : [];
    } else {
      j.kelas_list = j.kelas_list.map(x => String(x || '').trim()).filter(Boolean);
    }
    j.kelas = j.kelas_list.join(', ');
    if (!Array.isArray(j.kunci)) {
      j.kunci = (j.kunci && typeof j.kunci === 'object') ? (j.kunci.A || Object.values(j.kunci)[0] || []) : [];
    }
    j.jumlah_esai = Math.max(0, Number(j.jumlah_esai) || 0);
    if (j.jumlah_esai === 0) {
      j.bobot_pg = 100;
      j.bobot_esai = 0;
    } else {
      const bp = j.bobot_pg !== undefined ? Number(j.bobot_pg) : 80;
      j.bobot_pg = Math.max(0, Math.min(100, bp));
      j.bobot_esai = j.bobot_esai !== undefined ? Number(j.bobot_esai) : (100 - j.bobot_pg);
    }
    if (!Array.isArray(j.skor_maks_esai) || j.skor_maks_esai.length !== j.jumlah_esai) {
      const defMax = j.jumlah_esai > 0 ? Math.round((100 / j.jumlah_esai) * 10) / 10 : 10;
      j.skor_maks_esai = Array.from({ length: j.jumlah_esai }, (_, i) => Number(j.skor_maks_esai?.[i]) || defMax);
    }
  });
}

async function reload(keys) {
  for (const k of keys) {
    const rows = await dbAll(k);
    if (k === 'settings') {
      const def = rows.find(x => x.id === 'default') || rows[0] || {};
      S.data.settings = {
        ...clone(DEFAULT_SETTINGS),
        ...def,
        kop_lines: Array.isArray(def.kop_lines) && def.kop_lines.length ? def.kop_lines : clone(DEFAULT_KOP_LINES),
        ljk_title_lines: Array.isArray(def.ljk_title_lines) && def.ljk_title_lines.length ? def.ljk_title_lines : clone(DEFAULT_LJK_TITLE_LINES),
        pg_header_lines: Array.isArray(def.pg_header_lines) && def.pg_header_lines.length ? def.pg_header_lines : clone(DEFAULT_PG_HEADER_LINES)
      };
      applyTheme();
    } else {
      S.data[k] = rows;
    }
  }
  decorate();
}

async function verifyAdminPassword(pass) {
  if (!pass) throw new Error('Masukkan password Admin untuk konfirmasi.');
  if (IS_PREVIEW) {
    if (pass !== MEM.adminAuth.password) throw new Error('Password Admin salah.');
    return true;
  }
  const user = auth?.currentUser;
  if (!user || !user.email) throw new Error('Sesi Admin Firebase tidak ditemukan. Silakan masuk ulang.');
  const cred = EmailAuthProvider.credential(user.email, pass);
  await reauthenticateWithCredential(user, cred);
  return true;
}

/* ===================== HELPER DOMAIN & PERHITUNGAN SKOR (PG + ESAI) ===================== */
function scoreCombined(ansPG, keyPG, esaiScores, j) {
  let b = 0, s = 0, k = 0;
  for (let i = 0; i < j.jumlah_soal; i++) {
    const a = ansPG[i] || '';
    if (a === '') k++;
    else if (a === keyPG[i]) b++;
    else s++;
  }
  const nilaiPG = j.jumlah_soal > 0 ? (b / j.jumlah_soal) * 100 : 0;

  let nilaiEsai = 0;
  const nEsai = Number(j.jumlah_esai) || 0;
  if (nEsai > 0) {
    const maksArr = j.skor_maks_esai || Array(nEsai).fill(10);
    const totalMaks = maksArr.reduce((sum, v) => sum + (Number(v) || 0), 0);
    const totalPerolehan = Array.from({ length: nEsai }, (_, i) => Math.max(0, Math.min(Number(maksArr[i]) || 0, Number(esaiScores?.[i]) || 0))).reduce((sum, v) => sum + v, 0);
    nilaiEsai = totalMaks > 0 ? (totalPerolehan / totalMaks) * 100 : 0;
  }

  const bp = nEsai > 0 ? (Number(j.bobot_pg) ?? 80) : 100;
  const be = nEsai > 0 ? (Number(j.bobot_esai) ?? (100 - bp)) : 0;
  const totalBobot = (bp + be) || 100;
  const nilaiAkhir = ((nilaiPG * bp) + (nilaiEsai * be)) / totalBobot;

  return {
    benar: b,
    salah: s,
    kosong: k,
    nilai_pg: Math.round(nilaiPG * 100) / 100,
    nilai_esai: Math.round(nilaiEsai * 100) / 100,
    nilai: Math.round(Math.max(0, Math.min(100, nilaiAkhir)) * 100) / 100
  };
}

/* ===================== GEOMETRI OMR & STUDIO CETAK LJK UNIVERSAL (A4) ===================== */
const G = { S: 4, W: 840, H: 1188, x0: 16, colW: 37, px: 5.6, py: 9, y0: 122, per: 10, r: 2.3 };
const bx = (q, j) => G.x0 + G.colW * Math.floor(q / G.per) + 9.5 + G.px * j;
const by = q => G.y0 + G.py * (q % G.per);

function renderMultiLinesSVG(linesArr, cx, startY, defaultMaxY, sizeScale = 0.30, lineGap = 1.15) {
  const lines = (linesArr || []).filter(l => l.show !== false && (l.text || '').trim() !== '');
  let svg = '';
  let y = startY;
  lines.forEach(l => {
    const sz = Math.max(1.9, Math.min(4.8, (Number(l.size) || 10) * sizeScale));
    if (y + sz > defaultMaxY) return;
    const fw = l.bold ? 'bold' : 'normal';
    const fs = l.italic ? 'italic' : 'normal';
    const td = l.underline ? 'underline' : 'none';
    svg += `<text x="${cx}" y="${y.toFixed(2)}" font-size="${sz.toFixed(2)}" font-weight="${fw}" font-style="${fs}" text-decoration="${td}" text-anchor="middle" fill="#000" font-family="Arial,Helvetica,sans-serif">${esc(l.text)}</text>`;
    y += sz + lineGap;
  });
  return { svg, endY: y, count: lines.length };
}

function renderKopMiniSVG(set, offX, topY, width) {
  const lines = (set.kop_lines || DEFAULT_KOP_LINES).filter(l => l.show !== false && (l.text || '').trim() !== '');
  const cx = offX + width / 2;
  const scale = width / 170;
  let g = '';
  const hasL = Boolean((set.logo_kiri || '').trim());
  const hasR = Boolean((set.logo_kanan || '').trim());
  const logoSz = 17 * scale;
  if (hasL) g += `<image href="${esc(set.logo_kiri)}" x="${offX}" y="${topY}" width="${logoSz}" height="${logoSz}" preserveAspectRatio="xMidYMid meet"/>`;
  if (hasR) g += `<image href="${esc(set.logo_kanan)}" x="${offX + width - logoSz}" y="${topY}" width="${logoSz}" height="${logoSz}" preserveAspectRatio="xMidYMid meet"/>`;

  let y = topY + 3.4 * scale;
  lines.forEach(l => {
    const sz = Math.max(1.9, Math.min(4.6, (Number(l.size) || 11) * 0.28 * scale));
    const fw = l.bold ? 'bold' : 'normal';
    const fs = l.italic ? 'italic' : 'normal';
    const td = l.underline ? 'underline' : 'none';
    g += `<text x="${cx}" y="${y.toFixed(2)}" font-size="${sz.toFixed(2)}" font-weight="${fw}" font-style="${fs}" text-decoration="${td}" text-anchor="middle" fill="#000" font-family="Arial,Helvetica,sans-serif">${esc(l.text)}</text>`;
    y += sz + 1.0 * scale;
  });

  const lineY = Math.max(topY + 18 * scale, Math.min(35.5, y + 0.4));
  g += `<line x1="${offX}" y1="${lineY.toFixed(2)}" x2="${offX + width}" y2="${lineY.toFixed(2)}" stroke="#000" stroke-width="0.6"/>`;
  g += `<line x1="${offX}" y1="${(lineY + 0.9).toFixed(2)}" x2="${offX + width}" y2="${(lineY + 0.9).toFixed(2)}" stroke="#000" stroke-width="0.25"/>`;
  return { svg: g, endY: lineY + 1.8 };
}

/* Bangun 1 Lembar LJK Standar (210 x 297 mm) — Koordinat Bulatan PG tetap terkunci di y0 = 122 agar 100% terbaca OMR Scanner */
function buildSingleLJKSvgInner(cfg) {
  const set = D().settings;
  const pgOn = cfg.pgOn !== false;
  const pgOrder = cfg.pgOrder === 'row' ? 'row' : 'col';
  const cols = Math.max(1, Math.min(5, Number(cfg.cols) || 5));
  const rows = Math.max(1, Math.min(25, Number(cfg.rows) || 10));
  const maxPg = Math.max(1, Math.min(50, Number(cfg.maxPg) || 50));
  const opsi = Number(cfg.opsi) === 4 ? 4 : 5;
  const zoom = Math.max(70, Math.min(130, Number(cfg.zoom) || 100)) / 100;
  const esaiOn = Boolean(cfg.esaiOn);
  const esaiCount = Math.max(1, Math.min(15, Number(cfg.esaiCount) || 5));

  const R = (x, y, w, h, f = '#000') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
  const T = (x, y, t, sz = 3.0, w = 'normal', a = 'start', f = '#000') => `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${w}" text-anchor="${a}" fill="${f}" font-family="Arial,Helvetica,sans-serif">${esc(t)}</text>`;

  // 4 Penanda Sudut OMR (3 kecil 8x8 + 1 penanda jangkar kanan-bawah 12x12)
  let g = `<rect width="210" height="297" fill="#fff"/>`
    + R(8, 8, 8, 8)
    + R(194, 8, 8, 8)
    + R(8, 281, 8, 8)
    + R(192, 279, 12, 12);

  // 1. Kop Surat (y = 11 .. ~36)
  const kop = renderKopMiniSVG(set, 20, 11, 170);
  g += kop.svg;

  // 2. Keterangan Judul LJK Multi-Baris (y = ~38 .. ~52)
  const bannerY = Math.min(42, kop.endY + 1.2);
  const titleLines = cfg.customTitleLines || set.ljk_title_lines || DEFAULT_LJK_TITLE_LINES;
  const renderedTitle = renderMultiLinesSVG(titleLines, 105, bannerY + 3.6, bannerY + 14.5, 0.28, 0.9);
  const boxH = Math.max(6.2, renderedTitle.count > 0 ? (renderedTitle.endY - bannerY + 0.6) : 6.2);
  g += `<rect x="20" y="${bannerY.toFixed(2)}" width="170" height="${boxH.toFixed(2)}" rx="1.2" fill="none" stroke="#000" stroke-width="0.4"/>`;
  g += renderedTitle.svg;

  // 3. Kotak Identitas Peserta (y = ~54 .. ~76)
  const boxY = Math.min(56, bannerY + boxH + 1.6);
  g += `<rect x="20" y="${boxY.toFixed(2)}" width="112" height="9.5" rx="1.2" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(22.5, boxY + 3.6, 'NAMA LENGKAP PESERTA', 2.1, 'bold');
  g += T(22.5, boxY + 7.8, '..................................................................................', 2.5);

  g += `<rect x="135" y="${boxY.toFixed(2)}" width="55" height="9.5" rx="1.2" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(137.5, boxY + 3.6, 'NO. PESERTA / NIS', 2.1, 'bold');
  g += T(137.5, boxY + 7.8, '......................................', 2.5);

  const boxY2 = boxY + 11.0;
  g += `<rect x="20" y="${boxY2.toFixed(2)}" width="112" height="9.5" rx="1.2" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(22.5, boxY2 + 3.6, 'MATA PELAJARAN', 2.1, 'bold');
  g += T(22.5, boxY2 + 7.8, '..................................................................................', 2.5);

  g += `<rect x="135" y="${boxY2.toFixed(2)}" width="55" height="9.5" rx="1.2" fill="none" stroke="#000" stroke-width="0.35"/>`;
  g += T(137.5, boxY2 + 3.6, 'KELAS / RUANG', 2.1, 'bold');
  g += T(137.5, boxY2 + 7.8, '......................................', 2.5);

  // 4. Area Pilihan Ganda (Keterangan Multi-Baris di atas y=116, lalu Bulatan PG terkunci di y0 = 122)
  let afterPgY = 122;
  if (pgOn) {
    const pgHdrStart = Math.max(94, boxY2 + 13.5);
    const pgHdrLines = set.pg_header_lines || DEFAULT_PG_HEADER_LINES;
    const renderedPgHdr = renderMultiLinesSVG(pgHdrLines, 105, pgHdrStart, 117.5, 0.28, 0.9);
    g += renderedPgHdr.svg;

    const totalSlots = Math.min(maxPg, cols * rows);
    const colW = 185 / cols;
    const rad = G.r * zoom;
    const stepX = Math.min(5.6, (colW - 11) / opsi);
    const stepY = rows <= 10 ? 9 : Math.max(6.2, 92 / rows);

    for (let idx = 0; idx < totalSlots; idx++) {
      const c = pgOrder === 'col' ? Math.floor(idx / rows) : (idx % cols);
      const r = pgOrder === 'col' ? (idx % rows) : Math.floor(idx / cols);
      const qNum = idx + 1;
      const baseX = (cols === 5 && rows === 10 && pgOrder === 'col') ? (G.x0 + G.colW * c) : (14 + colW * c);
      const cy = (cols === 5 && rows === 10 && pgOrder === 'col') ? (G.y0 + G.py * r) : (122 + stepY * r);
      g += T(baseX + 5.8, cy + 1.05, String(qNum).padStart(2, '0') + '.', 2.8, 'bold', 'end');
      for (let jj = 0; jj < opsi; jj++) {
        const cx = (cols === 5 && rows === 10 && pgOrder === 'col') ? bx(idx, jj) : (baseX + 9.5 + stepX * jj);
        g += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${rad.toFixed(2)}" fill="none" stroke="#000" stroke-width="0.32"/>`;
        g += T(cx, cy + 0.85, LET[jj], 2.1 * zoom, 'bold', 'middle', '#222');
      }
      afterPgY = Math.max(afterPgY, cy + 6.5);
    }
    g += T(105, afterPgY + 2, 'Pastikan keempat kotak hitam sudut terlihat jelas saat difoto / discan', 2.2, 'normal', 'middle', '#444');
  }

  const showTtd = set.show_ttd_siswa !== false;
  const showNilai = set.show_nilai_guru !== false;
  const hasFooterBoxes = showTtd || showNilai;
  const footerBoxH = 24;
  const footerBoxY = 276 - footerBoxH; // y = 252 .. 276

  // 5. Area Uraian / Esai (Opsional)
  if (esaiOn) {
    let ey = pgOn ? Math.max(213, afterPgY + 5.5) : 102;
    g += T(105, ey, 'AREA JAWABAN URAIAN / ESAI', 2.7, 'bold', 'middle');
    ey += 3.2;
    const maxEsaiY = hasFooterBoxes ? (footerBoxY - 3) : 274;
    const availH = Math.max(20, maxEsaiY - ey);
    const lineGap = Math.max(5.0, Math.min(10.5, availH / esaiCount));
    for (let i = 0; i < esaiCount; i++) {
      const yLine = ey + (i + 1) * lineGap;
      if (yLine <= maxEsaiY) {
        g += T(20, yLine - 1.1, `${i + 1}.`, 2.5, 'bold');
        g += `<line x1="26" y1="${yLine.toFixed(1)}" x2="190" y2="${yLine.toFixed(1)}" stroke="#64748B" stroke-width="0.3" stroke-dasharray="1,0.8"/>`;
      }
    }
  }

  // 6. Kotak Tanda Tangan Siswa & Tempat Pengisian Nilai oleh Guru di Bagian Bawah
  if (hasFooterBoxes) {
    if (showTtd) {
      const xTtd = 20;
      const wTtd = showNilai ? 76 : 170;
      g += `<rect x="${xTtd}" y="${footerBoxY}" width="${wTtd}" height="${footerBoxH}" rx="1.4" fill="none" stroke="#000" stroke-width="0.35"/>`;
      g += T(xTtd + wTtd / 2, footerBoxY + 4.2, 'TANDA TANGAN PESERTA UJIAN', 2.2, 'bold', 'middle');
      g += `<line x1="${xTtd + 10}" y1="${footerBoxY + 18.5}" x2="${xTtd + wTtd - 10}" y2="${footerBoxY + 18.5}" stroke="#000" stroke-width="0.3" stroke-dasharray="1,0.8"/>`;
      g += T(xTtd + wTtd / 2, footerBoxY + 22.0, 'Nama Terang & Tanda Tangan Siswa', 1.9, 'normal', 'middle', '#444');
    }
    if (showNilai) {
      const xNil = showTtd ? 100 : 20;
      const wNil = showTtd ? 88 : 170;
      g += `<rect x="${xNil}" y="${footerBoxY}" width="${wNil}" height="${footerBoxH}" rx="1.4" fill="none" stroke="#000" stroke-width="0.35"/>`;
      g += `<line x1="${xNil}" y1="${footerBoxY + 5.5}" x2="${xNil + wNil}" y2="${footerBoxY + 5.5}" stroke="#000" stroke-width="0.3"/>`;
      g += T(xNil + wNil / 2, footerBoxY + 3.9, 'KOLOM PENILAIAN (DIISI MANUAL OLEH GURU)', 2.1, 'bold', 'middle');

      const c1 = xNil + wNil * 0.28;
      const c2 = xNil + wNil * 0.56;
      const c3 = xNil + wNil * 0.80;
      g += `<line x1="${c1}" y1="${footerBoxY + 5.5}" x2="${c1}" y2="${footerBoxY + footerBoxH}" stroke="#000" stroke-width="0.3"/>`;
      g += `<line x1="${c2}" y1="${footerBoxY + 5.5}" x2="${c2}" y2="${footerBoxY + footerBoxH}" stroke="#000" stroke-width="0.3"/>`;
      g += `<line x1="${c3}" y1="${footerBoxY + 5.5}" x2="${c3}" y2="${footerBoxY + footerBoxH}" stroke="#000" stroke-width="0.3"/>`;
      g += `<line x1="${xNil}" y1="${footerBoxY + 10.5}" x2="${xNil + wNil}" y2="${footerBoxY + 10.5}" stroke="#000" stroke-width="0.25"/>`;

      g += T((xNil + c1) / 2, footerBoxY + 8.8, 'NILAI PG', 2.0, 'bold', 'middle');
      g += T((c1 + c2) / 2, footerBoxY + 8.8, 'NILAI ESAI', 2.0, 'bold', 'middle');
      g += T((c2 + c3) / 2, footerBoxY + 8.8, 'NILAI AKHIR', 2.0, 'bold', 'middle');
      g += T((c3 + xNil + wNil) / 2, footerBoxY + 8.8, 'PARAF', 2.0, 'bold', 'middle');
    }
  }

  g += T(105, 291, `Template LJK Universal — ${set.app_name || 'Sistem Koreksi Hasil Sumatif Akhir Semester'}`, 2.2, 'normal', 'middle', '#64748B');
  return g;
}

/* ---------- 2. Scan LJK (Pilihan Ganda) ---------- */
let CVP = null;
function loadOpenCV() {
  if (CVP) return CVP;
  CVP = new Promise((res, rej) => {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.1/dist/opencv.js',
      'https://docs.opencv.org/4.8.0/opencv.js'
    ];
    let ui = 0;
    const ready = () => window.cv && window.cv.Mat;
    if (ready()) return res();
    const next = () => {
      if (ui >= urls.length) { CVP = null; return rej(new Error('Gagal memuat OpenCV.js. Periksa koneksi internet.')); }
      const s = document.createElement('script');
      s.async = true;
      s.src = urls[ui++];
      s.onerror = () => { s.remove(); next(); };
      s.onload = () => {
        let t = 0, thenDone = false;
        const iv = setInterval(() => {
          t++;
          if (ready()) { clearInterval(iv); return res(); }
          if (window.cv && typeof window.cv.then === 'function' && !thenDone) {
            thenDone = true;
            window.cv.then(m => { if (m && m.Mat) window.cv = m; });
          }
          if (t > 400) { clearInterval(iv); CVP = null; rej(new Error('OpenCV.js timeout, coba muat ulang halaman.')); }
        }, 150);
      };
      document.head.appendChild(s);
    };
    next();
  });
  return CVP;
}

function findMarkers(gray, w, h, T) {
  const blur = T(new cv.Mat());
  cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
  const bin = T(new cv.Mat());
  let bs = Math.max(51, Math.round(Math.min(w, h) / 10));
  if (bs % 2 === 0) bs++;
  cv.adaptiveThreshold(blur, bin, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY_INV, bs, 12);
  const cons = T(new cv.MatVector()), hier = T(new cv.Mat());
  cv.findContours(bin, cons, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
  const tot = w * h, cand = [];
  for (let i = 0; i < cons.size(); i++) {
    const c = cons.get(i);
    try {
      const area = cv.contourArea(c);
      if (area < tot * 0.00006 || area > tot * 0.02) continue;
      const rr = cv.minAreaRect(c), rw = rr.size.width, rh = rr.size.height;
      if (!rw || !rh) continue;
      if (Math.min(rw, rh) / Math.max(rw, rh) < 0.6 || area / (rw * rh) < 0.8) continue;
      const r = cv.boundingRect(c), cx0 = r.x + r.width / 2, cy0 = r.y + r.height / 2;
      const pts = [[.57, 0], [-.57, 0], [0, .57], [0, -.57], [.4, .4], [-.4, .4], [.4, -.4], [-.4, -.4]];
      let ink = 0;
      pts.forEach(([fx, fy]) => {
        const x = Math.round(cx0 + fx * r.width / 2), y = Math.round(cy0 + fy * r.height / 2);
        if (x >= 0 && y >= 0 && x < w && y < h && bin.ucharAt(y, x) > 0) ink++;
      });
      if (ink < 7) continue;
      const m = cv.moments(c);
      cand.push({ x: m.m10 / m.m00, y: m.m01 / m.m00, area });
    } finally { c.delete(); }
  }
  cand.sort((a, b) => b.area - a.area);
  const top = cand.slice(0, 9);
  let best = null;
  const sortCW = q => {
    const cx = q.reduce((a, p) => a + p.x, 0) / 4, cy = q.reduce((a, p) => a + p.y, 0) / 4;
    return q.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  };
  const polyArea = q => {
    let a = 0;
    for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; }
    return Math.abs(a) / 2;
  };
  for (let a = 0; a < top.length; a++) for (let b = a + 1; b < top.length; b++) for (let c = b + 1; c < top.length; c++) for (let d = c + 1; d < top.length; d++) {
    const q = [top[a], top[b], top[c], top[d]], ar = q.map(p => p.area).sort((x, y) => x - y);
    if (ar[2] / ar[0] > 1.9) continue;
    const sm = (ar[0] + ar[1] + ar[2]) / 3, ratio = ar[3] / sm;
    if (ratio < 1.5 || ratio > 3.6) continue;
    const pa = polyArea(sortCW(q));
    if (!best || pa > best.pa) best = { q, pa };
  }
  if (!best) return null;
  const cw = sortCW(best.q);
  let k = 0;
  cw.forEach((p, i) => { if (p.area > cw[k].area) k = i; });
  return [cw[(k + 2) % 4], cw[(k + 3) % 4], cw[k], cw[(k + 1) % 4]];
}

async function analyzeImage(srcCanvas) {
  await loadOpenCV();
  const trash = [];
  const T = m => (trash.push(m), m);
  try {
    const sc = Math.min(1, 1800 / Math.max(srcCanvas.width, srcCanvas.height));
    const c0 = document.createElement('canvas');
    c0.width = Math.round(srcCanvas.width * sc);
    c0.height = Math.round(srcCanvas.height * sc);
    c0.getContext('2d').drawImage(srcCanvas, 0, 0, c0.width, c0.height);
    const src = T(cv.imread(c0)), gray = T(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const p = findMarkers(gray, c0.width, c0.height, T);
    if (!p) throw new Error('Penanda hitam di 4 sudut LJK tidak terdeteksi. Pastikan seluruh lembar masuk frame dan pencahayaan merata.');
    const sp = T(cv.matFromArray(4, 1, cv.CV_32FC2, p.flatMap(o => [o.x, o.y])));
    const dp = T(cv.matFromArray(4, 1, cv.CV_32FC2, [12 * G.S, 12 * G.S, 198 * G.S, 12 * G.S, 198 * G.S, 285 * G.S, 12 * G.S, 285 * G.S]));
    const M = T(cv.getPerspectiveTransform(sp, dp)), wc = T(new cv.Mat()), wg = T(new cv.Mat()), sz = new cv.Size(G.W, G.H);
    cv.warpPerspective(src, wc, M, sz, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));
    cv.warpPerspective(gray, wg, M, sz, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255));
    const warp = document.createElement('canvas');
    cv.imshow(warp, wc);
    const bl = T(new cv.Mat()), bin = T(new cv.Mat());
    cv.GaussianBlur(wg, bl, new cv.Size(3, 3), 0);
    cv.adaptiveThreshold(bl, bin, 255, cv.ADAPTIVE_THRESH_MEAN_C, cv.THRESH_BINARY_INV, 41, 12);
    return { warp, bin: new Uint8Array(bin.data) };
  } finally {
    trash.forEach(m => { try { m.delete(); } catch (e) { } });
  }
}

function readBubbles(bin, n, k) {
  const R = Math.round(1.3 * G.S), offs = [];
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) if (dx * dx + dy * dy <= R * R) offs.push([dx, dy]);
  const out = [];
  for (let q = 0; q < n; q++) {
    const row = [];
    for (let j = 0; j < k; j++) {
      const cx = Math.round(bx(q, j) * G.S), cy = Math.round(by(q) * G.S);
      let best = 1;
      for (const sy of [-2, 0, 2]) for (const sx of [-2, 0, 2]) {
        let c = 0;
        for (const [dx, dy] of offs) {
          const x = cx + sx + dx, y = cy + sy + dy;
          if (x >= 0 && y >= 0 && x < G.W && y < G.H && bin[y * G.W + x]) c++;
        }
        best = Math.min(best, c / offs.length);
      }
      row.push(best);
    }
    out.push(row);
  }
  return out;
}
function decideRow(row) {
  const mx = Math.max(...row);
  if (mx < 0.35) return '';
  const marked = row.map((v, i) => v >= Math.max(0.35, mx * 0.72) ? i : -1).filter(i => i >= 0);
  return marked.length > 1 ? '*' : LET[marked[0]];
}

const scanJ = () => visJadwal().find(j => j.id === S.ui.scanJ);
function stopCam() { LIVE.on = false; clearTimeout(LIVE.t); try { S.cam?.getTracks().forEach(t => t.stop()); } catch (e) { } S.cam = null; }
const A4R = 210 / 297, LIVE = { on: false, t: 0, stable: 0, last: null, cool: 0, busy: false };

function cropFrame(outW) {
  const v = $('#camVideo');
  if (!v || !v.videoWidth) return null;
  const vw = v.videoWidth, vh = v.videoHeight;
  let sw, sh, sx, sy;
  if (vw / vh > A4R) { sh = vh; sw = vh * A4R; sx = (vw - sw) / 2; sy = 0; }
  else { sw = vw; sh = vw / A4R; sx = 0; sy = (vh - sh) / 2; }
  const c = document.createElement('canvas');
  c.width = Math.round(outW || sw);
  c.height = Math.round((outW || sw) / A4R);
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
async function startCam() {
  stopCam();
  try {
    S.cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const v = $('#camVideo');
    if (v) { v.srcObject = S.cam; await v.play(); $('#camHint')?.remove(); }
    liveStart();
  } catch (e) {
    toast('Kamera live tidak dapat diakses: ' + (e.message || e.name) + '. Gunakan tombol Ambil Foto atau Pilih Galeri.', 'err', 5000);
  }
}
function snap() {
  const c = cropFrame();
  if (!c) return toast('Kamera belum aktif', 'err');
  handleCanvas(c);
}
async function liveStart() {
  const stat = $('#camStat');
  if (stat) { stat.style.display = 'block'; stat.textContent = 'Memuat pemindai…'; }
  try { await loadOpenCV(); } catch (e) { if (stat) stat.textContent = 'Deteksi otomatis tidak tersedia — gunakan Ambil & Proses'; return; }
  if (!S.cam) return;
  LIVE.on = true; LIVE.stable = 0; LIVE.last = null; LIVE.cool = Date.now() + 800;
  liveTick();
}
function liveDraw(pts, w, h, state) {
  const ov = $('#camOv');
  if (!ov) return;
  if (ov.width !== w) { ov.width = w; ov.height = h; }
  const x = ov.getContext('2d');
  x.clearRect(0, 0, w, h);
  if (!pts) return;
  x.lineWidth = 3;
  x.strokeStyle = state === 'ok' ? '#10B981' : '#F59E0B';
  x.fillStyle = 'rgba(16,185,129,.14)';
  x.beginPath();
  pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
  x.closePath();
  x.fill();
  x.stroke();
  pts.forEach(p => { x.beginPath(); x.arc(p.x, p.y, 7, 0, 7); x.fillStyle = state === 'ok' ? '#10B981' : '#F59E0B'; x.fill(); });
}
function liveTick() {
  if (!LIVE.on || !S.cam || S.page !== 'scan') return;
  LIVE.t = setTimeout(liveTick, 240);
  if (LIVE.busy || S.scanR || !$('#camVideo')) return;
  LIVE.busy = true;
  const trash = [];
  const T = m => (trash.push(m), m);
  try {
    const c = cropFrame(480);
    if (!c) return;
    const w = c.width, h = c.height;
    const src = T(cv.imread(c)), gray = T(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    const p = findMarkers(gray, w, h, T), stat = $('#camStat'), box = $('#camBox');
    if (!p) {
      LIVE.stable = 0; LIVE.last = null; liveDraw(null, w, h); box?.classList.remove('ok');
      if (stat) stat.textContent = 'Arahkan kamera: 4 kotak hitam sudut LJK harus terlihat';
      return;
    }
    const moved = LIVE.last ? Math.max(...p.map((o, i) => Math.hypot(o.x - LIVE.last[i].x, o.y - LIVE.last[i].y))) : 999;
    LIVE.stable = moved < 7 ? LIVE.stable + 1 : 1;
    LIVE.last = p.map(o => ({ x: o.x, y: o.y }));
    const ready = LIVE.stable >= 5;
    liveDraw(p, w, h, ready ? 'ok' : 'wait');
    box?.classList.toggle('ok', ready);
    if (stat) stat.textContent = ready ? (S.ui.autoCap ? 'Terdeteksi, memproses…' : 'Terdeteksi — tekan Ambil & Proses') : 'Sudut terdeteksi — tahan kamera stabil…';
    if (ready && S.ui.autoCap && Date.now() > LIVE.cool) {
      LIVE.cool = Date.now() + 2500;
      LIVE.stable = 0;
      const full = cropFrame();
      if (full) handleCanvas(full);
    }
  } catch (e) { console.warn('live', e); } finally { trash.forEach(m => { try { m.delete(); } catch (e) { } }); LIVE.busy = false; }
}

function handleFile(file) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
    handleCanvas(c);
  };
  img.onerror = () => toast('File gambar tidak dapat dibaca', 'err');
  img.src = URL.createObjectURL(file);
}
async function handleCanvas(c) {
  const j = scanJ();
  if (!j) return toast('Pilih paket ujian terlebih dulu', 'err');
  try {
    setBusy(true, 'Memproses lembar jawaban…');
    const a = await analyzeImage(c);
    const fills = readBubbles(a.bin, j.jumlah_soal, j.jumlah_opsi);
    const answers = fills.map(decideRow), warn = [];
    const flat = fills.flat().sort((x, y) => x - y);
    if (flat[flat.length >> 1] > 0.25) warn.push('Banyak bulatan terbaca gelap: periksa bayangan/pencahayaan lalu scan ulang.');
    setResult({ siswaId: S.ui.scanSiswa || '', answers, warp: a.warp, warn });
  } catch (e) { console.error(e); toast(errMsg(e), 'err', 5500); } finally { setBusy(false); }
}
function simulateScan() {
  if (!IS_PREVIEW) return;
  const j = scanJ();
  if (!j) return toast('Pilih paket ujian terlebih dulu', 'err');
  const key = kunciOf(j.id);
  const answers = Array.from({ length: j.jumlah_soal }, (_, i) => Math.random() < 0.18 ? (Math.random() < 0.25 ? '' : LET[Math.floor(Math.random() * j.jumlah_opsi)]) : (key[i] || ''));
  setResult({ siswaId: S.ui.scanSiswa || '', answers, warp: null, warn: ['Mode Simulasi (Preview): jawaban dibuat acak dari kunci jawaban.'] });
}

function setResult(r) {
  const j = scanJ();
  r.key = kunciOf(j.id);
  S.scanR = r;
  markDirty();
  renderScanLeft();
  renderResult();
}
function calcScanR() {
  const j = scanJ(), r = S.scanR;
  if (!r || !j || !r.key || !r.key.some(Boolean)) return null;
  const ex = r.siswaId ? D().hasil.find(h => h.jadwal_id === j.id && h.siswa_id === r.siswaId) : null;
  return scoreCombined(r.answers, r.key, ex?.skor_esai || [], j);
}

function refreshResult() {
  const r = S.scanR, j = scanJ();

  if (sum) {
    if (sc) {
      const lulus = sc.nilai >= kkmOf(j);
      sum.innerHTML = `<div class="wm-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">
        <div class="wm-card" style="padding:11px 12px;border-color:#A7F3D0;background:#ECFDF5">

          <b style="font-size:20px;color:#B45309">${sc.kosong}</b>
        </div>
        <div class="wm-card" style="padding:11px 12px;border-color:${lulus ? '#BFDBFE' : '#FECDD3'};background:${lulus ? '#EFF6FF' : '#FFF1F2'}">

        </div>
      </div>`;
    } else {
      sum.innerHTML = `<div class="warn">Kunci jawaban paket ini belum diisi. Silakan isi kunci di menu <b>Paket & Kunci</b>.</div>`;
    }
  }

  $$('#qaGrid .kq').forEach(el => {
    const q = +el.dataset.q;
    const a = r.answers[q];
    const key = r.key ? r.key[q] : '';
    el.className = 'kq ' + (!key ? '' : (a === '' ? 'em' : (a === key ? 'ok' : 'no')));
    $$('.bub', el).forEach(b => {
      const L = b.dataset.l;
      const isSel = a === L;
      const isKey = key === L;
      let c = 'bub';
      if (isSel) c += !key ? ' on' : (a === key ? ' ok' : ' no');
      else if (isKey && a !== '') c += ' keyhint';
      b.className = c;
    });
  });

  const cv2 = $('#ovCanvas');
  if (!cv2 || !r.warp) return;
  cv2.width = G.W; cv2.height = G.H;
  const ctx = cv2.getContext('2d');
  ctx.drawImage(r.warp, 0, 0);
  for (let q = 0; q < j.jumlah_soal; q++) for (let k = 0; k < j.jumlah_opsi; k++) {
    const x = bx(q, k) * G.S, y = by(q) * G.S, L = LET[k], a = r.answers[q], key = r.key ? r.key[q] : null;
    if (a === L || a === '*') {
      ctx.beginPath(); ctx.arc(x, y, G.r * G.S * 0.9, 0, 7);
      ctx.fillStyle = key ? (a === key ? 'rgba(16,185,129,.55)' : 'rgba(244,63,94,.55)') : 'rgba(29,116,245,.5)';
      ctx.fill();
    }
    if (key === L && a !== key) {
      ctx.beginPath(); ctx.arc(x, y, G.r * G.S * 1.15, 0, 7);
      ctx.strokeStyle = '#1D74F5'; ctx.lineWidth = 3; ctx.stroke();
    }
  }
}

/* ---------- 3. Periksa Manual (PG & Esai) ---------- */
function syncManualState(forceReloadStudent = false) {
  const M = S.ui.manual;
  const js = visJadwal();
  if ((!M.j || !js.some(x => x.id === M.j)) && js.length) {
    M.j = js[0].id;
    M.kelas = '';
    M.siswa = '';
    forceReloadStudent = true;
  }
  const j = js.find(x => x.id === M.j);
  if (!j) return null;

  const availKelas = j.kelas_list || [];
  if (M.kelas && !availKelas.includes(M.kelas)) {
    M.kelas = '';
    M.siswa = '';
    forceReloadStudent = true;
  }
  const pool = pesertaJadwal(j)
    .filter(s => !M.kelas || s.kelas === M.kelas)
    .sort((a, b) => (a.kelas || '').localeCompare(b.kelas || '') || a.nama.localeCompare(b.nama));

  if (!M.siswa || !pool.some(s => s.id === M.siswa)) {
    M.siswa = pool[0]?.id || '';
    forceReloadStudent = true;
  }
  if (forceReloadStudent || M.answers.length !== j.jumlah_soal || M.esaiScores.length !== j.jumlah_esai) {
    const ex = M.siswa ? D().hasil.find(h => h.jadwal_id === j.id && h.siswa_id === M.siswa) : null;
    M.answers = Array.from({ length: j.jumlah_soal }, (_, i) => ex?.jawaban?.[i] || '');
    M.esaiScores = Array.from({ length: j.jumlah_esai }, (_, i) => ex?.skor_esai?.[i] ?? 0);
  }
  return { j, availKelas, pool };
}

async function saveManualResult() {
  const M = S.ui.manual;
  const j = visJadwal().find(x => x.id === M.j);
  if (!j || !M.siswa) return toast('Pilih paket ujian dan siswa terlebih dahulu', 'err');
  const key = kunciOf(j.id);
  if (j.jumlah_soal > 0 && (!key || !key.some(Boolean))) {
    return toast('Kunci jawaban PG paket ini belum diisi', 'err');
  }
  const sw = siswaOf(M.siswa);
  const sc = scoreCombined(M.answers, key, M.esaiScores, j);
  const ex = D().hasil.find(h => h.jadwal_id === j.id && h.siswa_id === M.siswa);
  const row = {
    jadwal_id: j.id,
    siswa_id: M.siswa,
    kelas: sw?.kelas || M.kelas || '',
    jawaban: [...M.answers],
    skor_esai: [...M.esaiScores],
    ...sc,
    scanned_by: S.user.nama,
    scanned_at: new Date().toISOString()
  };
  const ok = await guard(async () => {
    if (ex) await dbUpdate('hasil', ex.id, row);
    else await dbInsert('hasil', [row]);
    await reload(['hasil']);
    return true;
  }, 'Menyimpan hasil koreksi manual…');
  if (ok) {
    clearDirty();
    toast(`Tersimpan: ${sw?.nama} — Nilai Akhir ${num(sc.nilai)}`);
    const pool = pesertaJadwal(j).filter(s => !M.kelas || s.kelas === M.kelas).sort((a, b) => a.nama.localeCompare(b.nama));
    const nextSiswa = pool.find(s => !D().hasil.some(h => h.jadwal_id === j.id && h.siswa_id === s.id));
    if (nextSiswa) {
      M.siswa = nextSiswa.id;
      syncManualState(true);
    }
    renderView();
  }
}

async function resetHasilSingle(hasilId) {
  const h = D().hasil.find(x => x.id === hasilId);
  if (!h) return;
  const sw = siswaOf(h.siswa_id);
  const jw = D().jadwal.find(x => x.id === h.jadwal_id);
  const okConfirm = await confirmBox(`Reset nilai siswa ${sw?.nama || 'ini'} pada mata pelajaran ${jw?.nama_ujian || '-'} (Nilai: ${num(h.nilai)})? Data nilai akan dihapus sehingga siswa dapat dikoreksi ulang.`, 'Ya, Reset Nilai');
  if (!okConfirm) return;
  const ok = await guard(async () => {
    await dbDelete('hasil', hasilId);
    await reload(['hasil']);
    return true;
  }, 'Mereset nilai siswa…');
  if (ok) {
    toast(`Nilai ${sw?.nama || 'siswa'} berhasil direset`);
    renderView();
  }
}

async function resetHasilBulk(hasilIds, descLabel) {
  if (!hasilIds.length) return;
  const okConfirm = await confirmBox(`Reset ${hasilIds.length} data nilai siswa (${descLabel})? Seluruh nilai terpilih akan dihapus dan status peserta kembali menjadi "Menunggu".`, 'Ya, Reset Semua');
  if (!okConfirm) return;
  const ok = await guard(async () => {
    const chunkSize = 25;
    for (let i = 0; i < hasilIds.length; i += chunkSize) {
      await Promise.all(hasilIds.slice(i, i + chunkSize).map(id => dbDelete('hasil', id)));
    }
    await reload(['hasil']);
    return true;
  }, `Mereset ${hasilIds.length} data nilai…`);
  if (ok) {
    toast(`${hasilIds.length} data nilai berhasil direset`);
    renderView();
  }
}

function pgRekap() {
  const R = S.ui.rekap, js = visJadwal();
  if ((!R.j || !js.some(x => x.id === R.j)) && js.length) R.j = js[0].id;
  const modeTabs = `<div class="tabs2">
    <button class="${R.mode === 'ujian' ? 'on' : ''}" data-act="rkMode" data-m="ujian">Rekap Per Paket Ujian</button>
    <button class="${R.mode === 'akhir' ? 'on' : ''}" data-act="rkMode" data-m="akhir">Rekap Nilai Akhir Siswa</button>
    <button class="${R.mode === 'siswa' ? 'on' : ''}" data-act="rkMode" data-m="siswa">Riwayat Per Siswa</button>
  </div>`;

  if (R.mode === 'akhir') {
    const defKkm = Number(D().settings.kkm_default ?? 76);
    const activeKkm = (R.kkmCustom !== '' && R.kkmCustom !== null && !isNaN(Number(R.kkmCustom)))
      ? Math.max(0, Math.min(100, Number(R.kkmCustom)))
      : defKkm;

    const availClasses = kelasList();
    const selKelas = R.kelas && availClasses.includes(R.kelas) ? R.kelas : '';
    const students = D().siswa
      .filter(s => s.aktif !== false && (!selKelas || s.kelas === selKelas) && matchQ([s.nama, s.nis, s.nisn, s.kelas]))
      .sort((a, b) => (a.kelas || '').localeCompare(b.kelas || '', 'id', { numeric: true }) || (a.nama || '').localeCompare(b.nama || ''));

      .filter(j => !selKelas || (j.kelas_list || []).some(k => String(k).trim().toUpperCase() === selKelas.toUpperCase()))

          totalScores += val;
          countScores++;

          </label>

            <div style="display:flex;align-items:center;gap:8px;height:42px;flex-wrap:wrap">

    : [i + 1, x.s.nis, x.s.nama, x.s.kelas, x.h?.benar ?? '', x.h?.salah ?? '', x.h?.kosong ?? '', x.h ? Number(x.h.nilai) : '', x.h ? (x.h.nilai >= kkm ? 'Tuntas' : 'Remedial') : 'Belum dinilai']

        <div style="text-align:center">${kopHTML}</div>

        <p style="margin:0;font-size:10.5pt;color:#222">Kelas: <b>${esc(R.kelas || j.kelas)}</b> &bull; KKM: <b>${kkm}</b></p>

          <div>NIP. ${esc(set.nip_kepala || '-')}</div>

async function rkExportAkhirXlsx() {
  const R = S.ui.rekap, js = visJadwal(), set = D().settings;
  const defKkm = Number(set.kkm_default ?? 76);
  const activeKkm = (R.kkmCustom !== '' && R.kkmCustom !== null && !isNaN(Number(R.kkmCustom)))
    ? Math.max(0, Math.min(100, Number(R.kkmCustom)))
    : defKkm;

  const availClasses = kelasList();
  const selKelas = R.kelas && availClasses.includes(R.kelas) ? R.kelas : '';
  const students = D().siswa
    .filter(s => s.aktif !== false && (!selKelas || s.kelas === selKelas) && matchQ([s.nama, s.nis, s.nisn, s.kelas]))
    .sort((a, b) => (a.kelas || '').localeCompare(b.kelas || '', 'id', { numeric: true }) || (a.nama || '').localeCompare(b.nama || ''));

  const exams = js
    .filter(j => !selKelas || (j.kelas_list || []).some(k => String(k).trim().toUpperCase() === selKelas.toUpperCase()))
    .slice()
    .sort((a, b) => (a.nama_ujian || '').localeCompare(b.nama_ujian || '', 'id', { numeric: true }) || (a.kode_paket || '').localeCompare(b.kode_paket || ''));

  if (!students.length) return toast('Tidak ada data peserta untuk diekspor', 'err');

  await guard(async () => {
    await loadScript(LIBS.xlsx);
    const kopTitle = (set.kop_lines || DEFAULT_KOP_LINES).filter(l => l.show !== false).map(l => l.text).join(' — ');
    const hd = ['No', 'NIS', 'Nama Peserta', 'Kelas', ...exams.map(j => examLabel(j)), 'Rata-rata', 'Jml Tuntas', 'Jml Remedial'];
    const rowsData = students.map((s, idx) => {
      let sumN = 0, cntN = 0, cntOk = 0, cntRem = 0;
      const examVals = exams.map(j => {
        const h = D().hasil.find(x => x.jadwal_id === j.id && x.siswa_id === s.id);
        if (!h) return '';
        const val = Number(h.nilai);
        sumN += val;
        cntN++;
        if (val >= activeKkm) cntOk++; else cntRem++;
        return val;
      });
      const avgS = cntN ? Math.round((sumN / cntN) * 100) / 100 : '';
      return [idx + 1, s.nis, s.nama, s.kelas, ...examVals, avgS, cntOk, cntRem];
    });

    const aoa = [
      [kopTitle],
      ['REKAP NILAI AKHIR SISWA SEMUA MATA PELAJARAN'],
      [`Kelas: ${selKelas || 'Semua Kelas'} • KKM Penyesuaian: ${activeKkm} • Tanggal Ekspor: ${fmtDate(todayISO())}`],
      [],
      hd,
      ...rowsData
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Nilai Akhir Siswa');
    const fname = `Rekap_Nilai_Akhir_${selKelas ? 'Kelas_' + selKelas : 'Semua_Kelas'}_KKM_${activeKkm}.xlsx`;
    XLSX.writeFile(wb, fname);
  }, 'Mengekspor Rekap Nilai Akhir ke Excel…');
}

/* ----- Kunci Jawaban PG ----- */
function normalizeKeyChar(ch, maxOpsi) {
  const c = String(ch || '').toUpperCase();
  const mapNum = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', '5': 'E' };
  const letter = mapNum[c] || (LET.includes(c) ? c : '');
  if (!letter) return '';
  return LET.indexOf(letter) < maxOpsi ? letter : '';
}

function jdOpen(id) {
  const j = D().jadwal.find(x => x.id === id);
  const src = Array.isArray(j.kunci) ? j.kunci : [];
  const arr = Array.from({ length: j.jumlah_soal }, (_, i) => src[i] || '');
  openModal('', true);
  S.ui.jd = { id, arr };
  jdRender();
}

function jdRender() {
  const jd = S.ui.jd;
  if (!jd) return;
  const j = D().jadwal.find(x => x.id === jd.id), n = j.jumlah_soal, k = j.jumlah_opsi, a = jd.arr;
  const filled = a.filter(Boolean).length;
  const sumText = a.map((x, i) => `${i + 1}.${x || '-'}`).join('  ');

  setModal(`<div class="mh"><h3 style="margin:0">Kunci Jawaban PG — ${esc(examLabel(j))}</h3><button class="btn sm ghost ico-b" data-act="closeModal">${ic('x', 16)}</button></div>

  <div class="vgrid">${Array.from({ length: n }, (_, q) => `<div class="kq"><b>${q + 1}</b>${LET.slice(0, k).split('').map(L => `<button type="button" class="bub ${a[q] === L ? 'on' : ''}" data-act="jdBub" data-q="${q}" data-l="${L}">${L}</button>`).join('')}</div>`).join('')}</div>

async function jdSave() {
  const jd = S.ui.jd;
  if (!jd) return;
  const savedId = jd.id;
  const ok = await guard(async () => {
    await dbUpdate('jadwal', savedId, { kunci: [...jd.arr] });
    await reload(['jadwal', 'siswa', 'hasil']);
    return true;
  }, 'Menyimpan kunci jawaban…');
  if (ok) {
    S.ui.scanJ = savedId;
    S.ui.dashJ = savedId;
    S.ui.manual.j = savedId;
    S.ui.rekap.j = savedId;
    if (S.scanR) S.scanR.key = kunciOf(savedId);
    toast('Kunci jawaban tersimpan dan langsung siap digunakan pada Scan LJK');
    closeModal();
    renderView();
  }
}

function parseSiswaRow(cols) {
  let r = cols.map(c => c.trim());
  if (!r.length) return null;
  const h0 = r[0].toLowerCase();
  if (h0 === 'nis' || h0 === 'no' || h0 === 'nomor') return null;
  if (r.length >= 5 && /^\d{1,3}$/.test(r[0]) && r[1].length >= 4) {
    r = r.slice(1);
  }
  const isGender = v => /^(l|p|laki-laki|perempuan|laki|wanita|pria)$/i.test(String(v || '').trim());
  const normGender = v => /^(p|perempuan|wanita)/i.test(String(v || '').trim()) ? 'P' : 'L';

  let nis = '', nisn = '', nama = '', kelas = '', jk = 'L';
  if (r.length >= 5) {
    nis = r[0];
    nisn = r[1];
    nama = r[2];
    kelas = r[3];
    jk = normGender(r[4]);
  } else if (r.length === 4) {
    if (isGender(r[3])) {
      nis = r[0];
      nisn = '';
      nama = r[1];
      kelas = r[2];
      jk = normGender(r[3]);
    } else {
      nis = r[0];
      nisn = r[1];
      nama = r[2];
      kelas = r[3];
    }
  } else if (r.length === 3) {
    nis = r[0];
    nisn = '';
    nama = r[1];
    kelas = r[2];
  } else {
    return null;
  }

  if (!nis || !nama || !kelas) return null;
  return { nis, nisn, nama, kelas, jenis_kelamin: jk, aktif: true };
}

function updateBulkPreview(text) {
  if (!S.ui.bulk) return;
  const kind = S.ui.bulk.kind;
  const raw = parseDelimitedText(text);
  let valid = [];
  let skippedDup = 0;

  if (kind === 'siswa') {
    const existingNis = new Set(D().siswa.map(s => String(s.nis || '').trim().toLowerCase()));
    const seenNis = new Set();
    raw.forEach(cols => {
      const parsed = parseSiswaRow(cols);
      if (!parsed) return;
      const key = parsed.nis.toLowerCase();
      if (existingNis.has(key) || seenNis.has(key)) {
        skippedDup++;
        return;
      }
      seenNis.add(key);
      valid.push(parsed);
    });
  } else if (kind === 'guru') {
    const existingUser = new Set(D().guru.map(g => String(g.username || '').trim().toLowerCase()));
    const seenUser = new Set();
    raw.forEach(r => {
      if (r.length < 4 || !r[1] || !r[2] || !r[3] || r[2].toLowerCase() === 'username') return;
      const key = r[2].trim().toLowerCase();
      if (existingUser.has(key) || seenUser.has(key)) { skippedDup++; return; }
      seenUser.add(key);
      valid.push({ nip: r[0] || '', nama: r[1], username: r[2].trim(), password: r[3], aktif: true });
    });
  } else if (kind === 'mapel') {
    const existingMapel = new Set(D().mapel.map(m => String(m.nama || '').trim().toLowerCase()));
    const seenMapel = new Set();
    raw.forEach(r => {
      if (r.length < 1 || !r[0] || r[0].toLowerCase() === 'nama') return;
      const key = r[0].trim().toLowerCase();
      if (existingMapel.has(key) || seenMapel.has(key)) { skippedDup++; return; }
      seenMapel.add(key);
      valid.push({ nama: r[0].trim(), kkm: Number(r[1]) || D().settings.kkm_default || 76 });
    });
  }

  S.ui.bulk.rows = valid;
  S.ui.bulk.skippedDup = skippedDup;

  const btn = $('#bulkSaveBtn');
  if (btn) {
    btn.disabled = valid.length === 0;
    btn.textContent = valid.length ? `Simpan (${valid.length} Baris)` : 'Simpan';
  }
  const prev = $('#bulkPreview');
  if (!prev) return;
  if (!valid.length && !skippedDup) {
    prev.innerHTML = `<p style="font-size:12px;color:var(--muted)">Belum ada baris valid terdeteksi. Pastikan setiap baris berisi minimal 3 kolom (contoh: <code>NIS;Nama;Kelas</code>).</p>`;
    return;
  }
  const sample = valid.slice(0, 6);
  prev.innerHTML = `
    ${skippedDup ? `<div class="warn" style="margin-bottom:6px">${skippedDup} baris dilewati karena NIS / Username / Nama sudah terdaftar atau duplikat.</div>` : ''}
    ${valid.length ? `<div class="info" style="margin-bottom:6px">Terdeteksi <b>${valid.length}</b> baris baru siap disimpan (pratinjau ${sample.length} pertama):</div>
    <div style="font-size:12px;background:var(--bg);padding:8px 12px;border-radius:12px;border:1px solid var(--line);display:grid;gap:3px">
      ${sample.map((r, i) => `<div><b>${i + 1}.</b> ${esc(Object.values(r).filter(v => typeof v !== 'boolean' && v !== '').join(' • '))}</div>`).join('')}
    </div>` : ''}`;
}

async function saveBulkRows() {
  const txtEl = $('#bulkText');
  if (txtEl && S.ui.bulk) updateBulkPreview(txtEl.value);
  const b = S.ui.bulk;
  if (!b || !b.rows || !b.rows.length) {
    return toast('Tidak ada baris data baru yang valid untuk disimpan', 'err');
  }
  const count = b.rows.length;
  const kind = b.kind;
  const rowsToSave = clone(b.rows);
  const ok = await guard(async () => {
    await dbInsert(kind, rowsToSave);
    await reload([kind]);
    return true;
  }, `Menyimpan ${count} data…`);
  if (ok) {
    toast(`${count} data berhasil ditambahkan`);
    S.ui.bulk = null;
    closeModal();
    renderView();
  }
}

function openResetConfirmModal() {
  const rs = S.ui.resetSel;
  const labels = {
    hasil: `Hasil Koreksi (${D().hasil.length})`,
    jadwal: `Paket & Kunci (${D().jadwal.length})`,
    siswa: `Peserta & Kelas (${D().siswa.length})`,
    guru: `Akun Guru (${D().guru.length})`,
    mapel: `Mata Pelajaran (${D().mapel.length})`
  };
  const chosen = Object.keys(rs).filter(k => rs[k]).map(k => labels[k]);
  if (!chosen.length) return toast('Pilih minimal satu koleksi data untuk direset', 'err');

  openModal(`<div class="mh"><h3 style="margin:0;color:#BE123C">Konfirmasi Reset System</h3><button class="btn sm ghost ico-b" data-act="closeModal">${ic('x', 16)}</button></div>
  <div class="warn"><b>Peringatan:</b> Sistem akan mengunduh cadangan otomatis (<code>.json</code>) terlebih dahulu sebelum menghapus permanen koleksi berikut:
    <ul style="margin:6px 0 0 18px;padding:0">${chosen.map(c => `<li><b>${esc(c)}</b></li>`).join('')}</ul>
  </div>
  <form data-form="confirmReset">
    <label class="f"><span>Masukkan Password Administrator untuk Melanjutkan *</span>
      <input class="inp" type="password" name="admin_pass" required autocomplete="current-password" placeholder="Password Admin">
    </label>
    <div class="macts">
      <button type="button" class="btn ghost" data-act="closeModal">Batal</button>
      <button type="submit" class="btn danger">${ic('trash-2', 15)} Verifikasi & Reset Sekarang</button>
    </div>
  </form>`, false, true);
}

async function executeResetSystem(adminPass) {
  const rs = S.ui.resetSel;
  const keys = Object.keys(rs).filter(k => rs[k]);
  if (!keys.length) return;

  const ok = await guard(async () => {
    await verifyAdminPassword(adminPass);
    download('auto_backup_sebelum_reset_' + todayISO() + '.json', JSON.stringify({
      exported_at: new Date().toISOString(),
      users: D().guru,
      mata_pelajaran: D().mapel,
      peserta_ujian: D().siswa,
      ujian_sas: D().jadwal,
      hasil_koreksi: D().hasil
    }, null, 2), 'application/json');

    for (const k of keys) {
      await dbClearCollection(k);
    }
    await reload(keys);
    return true;
  }, 'Memverifikasi Admin & mereset data terpilih…');

  if (ok) {
    toast('Reset data selesai. Backup otomatis telah diunduh.');
    closeModal();
    renderView();
  }
}

function getStudentExamRows(sw) {
  const clsUp = String(sw.kelas || '').trim().toUpperCase();
  const relevantExams = D().jadwal.filter(j =>
    (j.kelas_list || []).some(k => String(k).trim().toUpperCase() === clsUp) ||
    D().hasil.some(h => h.jadwal_id === j.id && h.siswa_id === sw.id)
  ).sort((a, b) => (a.nama_ujian || '').localeCompare(b.nama_ujian || '', 'id', { numeric: true }));

  return relevantExams
    .filter(j => matchQ([j.nama_ujian, j.kode_paket]))
    .map(j => {
      const h = D().hasil.find(x => x.jadwal_id === j.id && x.siswa_id === sw.id) || null;
      return { j, h, kkm: kkmOf(j) };
    });
}

function stuDetailModal(jid) {
  const sw = S.user;
  if (!sw || sw.role !== 'siswa') return;
  const j = D().jadwal.find(x => x.id === jid);
  const h = D().hasil.find(x => x.jadwal_id === jid && x.siswa_id === sw.id);
  if (!j || !h) return toast('Detail hasil koreksi belum tersedia untuk mata pelajaran ini', 'err');

  const key = kunciOf(j.id);
  const kkm = kkmOf(j);
  const lulus = Number(h.nilai) >= kkm;
  const hasEsai = (Number(j.jumlah_esai) || 0) > 0;
  const maksArr = j.skor_maks_esai || [];
  const totalMaksEsai = maksArr.reduce((a, b) => a + (Number(b) || 0), 0);
  const totalSkorEsai = (h.skor_esai || []).reduce((a, b) => a + (Number(b) || 0), 0);

  openModal(`<div class="mh">
    <div>
      <h3 style="margin:0">Detail Isian — ${esc(j.nama_ujian)}</h3>
      <small style="color:var(--muted)">${esc(sw.nama)} (${esc(sw.nis)}) • Kelas ${esc(sw.kelas)} • KKM ${kkm}</small>
    </div>

    <div class="wm-card" style="padding:11px 13px">
      <small>PG (Benar / Salah / Kosong)</small>

    </div>
    <div class="wm-card" style="padding:11px 13px">
      <small>Nilai Pilihan Ganda${hasEsai ? ` (${j.bobot_pg}%)` : ''}</small>
      <b style="font-size:18px;color:var(--pri)">${num(h.nilai_pg ?? h.nilai)}</b>
    </div>
    ${hasEsai ? `<div class="wm-card" style="padding:11px 13px">
      <small>Nilai Esai (${j.bobot_esai}%)</small>
      <b style="font-size:18px;color:#6366F1">${num(h.nilai_esai)}</b>
    </div>` : ''}
    <div class="wm-card" style="padding:11px 13px;border-color:${lulus ? '#A7F3D0' : '#FECDD3'};background:${lulus ? '#ECFDF5' : '#FFF1F2'}">
      <small>Nilai Akhir (${lulus ? 'Tuntas' : 'Remedial'})</small>
      <b style="font-size:19px;color:${lulus ? '#047857' : '#BE123C'}">${num(h.nilai)}</b>
    </div>
  </div>

  ${hasEsai ? `
    <div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:16px;padding:12px 14px;margin-bottom:12px">
      <b style="display:block;font-size:12.5px;color:#3730A3;margin-bottom:6px">${ic('file-edit', 14)} Rincian Perolehan Skor Soal Esai / Uraian</b>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
        ${Array.from({ length: j.jumlah_esai }, (_, i) => {
          const scItem = Number(h.skor_esai?.[i]) || 0;
          const mkItem = Number(maksArr[i]) || 0;
          return `<span class="bdg" style="background:#fff;color:#1E1B4B;border:1px solid #C7D2FE">No. ${i + 1}: <b>${num(scItem)}</b> / ${num(mkItem)}</span>`;
        }).join('')}
      </div>
      <div style="font-size:12px;color:#1E293B;line-height:1.5">
        <b>Cara Perhitungan Nilai Akhir:</b><br>
        • Nilai PG = (${h.benar} ÷ ${j.jumlah_soal}) × 100 = <b>${num(h.nilai_pg)}</b> (Bobot ${j.bobot_pg}%)<br>
        • Nilai Esai = (${num(totalSkorEsai)} ÷ ${num(totalMaksEsai)}) × 100 = <b>${num(h.nilai_esai)}</b> (Bobot ${j.bobot_esai}%)<br>
        • <b>Nilai Akhir</b> = (${num(h.nilai_pg)} × ${j.bobot_pg}%) + (${num(h.nilai_esai)} × ${j.bobot_esai}%) = <b style="color:var(--pri)">${num(h.nilai)}</b>
      </div>
    </div>
  ` : ''}

  <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;flex-wrap:wrap;gap:6px">
    <b style="font-size:12.5px">Rincian Jawaban Pilihan Ganda (${j.jumlah_soal} Soal)</b>

    ${Array.from({ length: j.jumlah_soal }, (_, q) => {

        ${kVal ? `<small style="color:var(--muted);font-size:11px">K:${kVal}</small>` : ''}
      </div>`;
    }).join('')}
  </div>
  <div class="macts"><button type="button" class="btn" data-act="closeModal">Tutup</button></div>`, true);
}

  if (!m.some(x => x.id === S.page)) S.page = 'dashboard';
  const map = {
    dashboard: pgDashboard,
    master: pgMaster,
    siswa: pgSiswa,
    jadwal: pgJadwal,
    scan: pgScan,
    manual: pgManual,
    rekap: pgRekap,
    pengaturan: pgPengaturan
  };
  return (map[S.page] || pgDashboard)();
}

function renderView() {
  if (S.user?.role === 'siswa') {
    $('#root').innerHTML = pgSiswaPortal();
    return;
  }
  if (S.page !== 'scan') stopCam();
  const c = $('#view');
  if (!c) return;
  c.innerHTML = viewHTML();
  if (S.page === 'scan') {
    renderScanLeft();
    renderResult();
  }
  const railSlot = $('#railSlot');

}

/* ===================== HANDLER EVENT DELEGASI ===================== */
$('#ljkApp').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const { act } = b.dataset;

  if (act === 'role') {
    S.ui.lrole = b.dataset.r;
    if (S.ui.lrole === 'siswa' && !IS_PREVIEW && D().siswa.length === 0) {
      await guard(() => reload(['settings', 'siswa', 'jadwal', 'hasil', 'mapel']), 'Memuat daftar kelas & siswa…');
    }
    render();
  }
  else if (act === 'toggleLoginPw') {
    S.ui.showLoginPw = !S.ui.showLoginPw;
    const inp = $('#loginPwInp');
    if (inp) inp.type = S.ui.showLoginPw ? 'text' : 'password';
    b.innerHTML = ic(S.ui.showLoginPw ? 'eye-off' : 'eye', 16);
  }
  else if (act === 'clearQ') {
    S.q = '';
    S.ui.pg = {};
    const sInp = $('#globalSearchInp');
    if (sInp) { sInp.value = ''; sInp.focus(); }
    const cBtn = $('#clearSearchBtn');
    if (cBtn) cBtn.style.display = 'none';
    renderView();
  }
  else if (act === 'go') {
    if (b.dataset.p !== S.page && !(await guardLeave())) return;
    S.page = b.dataset.p;
    closeModal();
    renderView();
  }
  else if (act === 'sideMin') { S.ui.sideMin = !S.ui.sideMin; $('.side')?.classList.toggle('min', S.ui.sideMin); b.innerHTML = ic(S.ui.sideMin ? 'chevron-right' : 'chevron-left', 16); }
  else if (act === 'logout') await logout();
  else if (act === 'closeModal') closeModal();

  else if (act === 'copySchema') copyText($('#schemaBox')?.textContent || FIRESTORE_SCHEMA_TEXT);

    S.scanR = null;

      ];
      S.ui.studio.maxPg = j.jumlah_soal;
      S.ui.studio.opsi = j.jumlah_opsi;
      S.ui.studio.esaiOn = j.jumlah_esai > 0;

  else if (act === 'studioClose') {

    $('#studioSlot').innerHTML = '';
  }
  else if (act === 'studioSet') {

    S.ui.studio[k] = k === 'perSheet' ? Number(v) : v;

  }
  else if (act === 'studioZoom') {
    S.ui.studio.zoom = Math.max(70, Math.min(130, (S.ui.studio.zoom || 100) + Number(b.dataset.d)));

    S.scanR = null;
    clearDirty();
    renderScanLeft();
    renderResult();
    if (S.ui.scanMode === 'cam') startCam();
  }
  else if (act === 'camStart') startCam();
  else if (act === 'camSnap') snap();
  else if (act === 'autoToggle') {
    S.ui.autoCap = !S.ui.autoCap;
    const ab = $('#autoBtn');
    if (ab) ab.textContent = S.ui.autoCap ? 'Auto-ambil: ON' : 'Auto-ambil: OFF';
  }
  else if (act === 'simScan') simulateScan();
  else if (act === 'scanBub') {
    const q = +b.dataset.q, L = b.dataset.l;
    S.scanR.answers[q] = S.scanR.answers[q] === L ? '' : L;
    markDirty();
    refreshResult();
  }
  else if (act === 'scanCancel') {
    S.scanR = null;
    clearDirty();
    LIVE.cool = Date.now() + 1800;
    LIVE.stable = 0;
    renderScanLeft();
    renderResult();
    if (S.ui.scanMode === 'cam') startCam();

  else if (act === 'scanSave') await saveResult();

  /* Periksa Manual (PG & Esai) */
  else if (act === 'manBub') {
    const q = +b.dataset.q, L = b.dataset.l;
    S.ui.manual.answers[q] = S.ui.manual.answers[q] === L ? '' : L;
    markDirty();
    const inp = $('#manPastePG');
    if (inp) inp.value = S.ui.manual.answers.map(x => x || '-').join('').replace(/-+$/, '');

  }
  else if (act === 'manClearPG') {
    S.ui.manual.answers.fill('');
    markDirty();
    const inp = $('#manPastePG');
    if (inp) inp.value = '';
    refreshManualCards();
  }
  else if (act === 'manFullEsai') {
    const j = visJadwal().find(x => x.id === S.ui.manual.j);
    if (!j) return;
    S.ui.manual.esaiScores = (j.skor_maks_esai || []).map(v => Number(v) || 10);

    renderView();

  else if (act === 'manSave') await saveManualResult();

  /* Master & Paket & Kunci */
  else if (act === 'masterTab') {
    if (b.dataset.t !== S.ui.masterTab && !(await guardLeave())) return;
    S.ui.masterTab = b.dataset.t;
    renderView();

  else if (act === 'guruForm') guruForm(b.dataset.id);
  else if (act === 'guruBulk') guruBulkModal();
  else if (act === 'mapelForm') mapelForm(b.dataset.id);
  else if (act === 'mapelBulk') mapelBulkModal();
  else if (act === 'siswaForm') siswaForm(b.dataset.id);
  else if (act === 'siswaBulk') siswaBulkModal();
  else if (act === 'bulkSave') await saveBulkRows();
  else if (act === 'siswaTpl') download('template_peserta.csv', 'nis;nisn;nama;kelas;jenis_kelamin\n252609001;0081234501;Ahmad Fauzan;9A;L\n252609002;0081234502;Siti Nurhaliza;9A;P\n');
  else if (act === 'jadwalForm') jadwalForm(b.dataset.id);

  else if (act === 'toggleFormKelas') {
    const k = b.dataset.k;
    const idx = S.ui.formKelasSel.indexOf(k);
    if (idx >= 0) S.ui.formKelasSel.splice(idx, 1);
    else S.ui.formKelasSel.push(k);
    b.classList.toggle('on', S.ui.formKelasSel.includes(k));
  }
  else if (act === 'addFormKelas') {
    const inp = $('#newKelasInp');
    const val = (inp?.value || '').trim().toUpperCase();
    if (!val) return;
    if (!S.ui.formKelasSel.includes(val)) S.ui.formKelasSel.push(val);
    inp.value = '';
    const box = $('#clsBtnBox');
    if (box && !$$('.cls-btn', box).some(btn => btn.dataset.k === val)) {
      if (box.querySelector('small')) box.innerHTML = '';
      const nb = document.createElement('button');
      nb.type = 'button';
      nb.className = 'cls-btn on';
      nb.dataset.act = 'toggleFormKelas';
      nb.dataset.k = val;
      nb.textContent = val;
      box.appendChild(nb);
    } else {
      $$('.cls-btn', box).forEach(btn => { if (btn.dataset.k === val) btn.classList.add('on'); });
    }
  }

  else if (act === 'jdOpen') jdOpen(b.dataset.id);
  else if (act === 'jdBub') {
    const q = +b.dataset.q, L = b.dataset.l;
    S.ui.jd.arr[q] = S.ui.jd.arr[q] === L ? '' : L;
    jdRender();
  }
  else if (act === 'jdClear') { S.ui.jd.arr.fill(''); jdRender(); }
  else if (act === 'jdCopySum') copyText($('#jdSumRaw')?.value || '');
  else if (act === 'jdSave') await jdSave();

  /* Rekap & Reset Nilai Siswa */
  else if (act === 'rkMode') {
    if (b.dataset.m !== S.ui.rekap.mode && !(await guardLeave())) return;
    S.ui.rekap.mode = b.dataset.m;
    renderView();
  }
  else if (act === 'rkResetKkm') {
    S.ui.rekap.kkmCustom = '';
    renderView();
  }
  else if (act === 'rkAkhirXlsx') await rkExportAkhirXlsx();
  else if (act === 'stuDetail') stuDetailModal(b.dataset.jid);
  else if (act === 'rkDetail') rkDetail(b.dataset.id);
  else if (act === 'rkXlsx') await rkExport('xlsx');
  else if (act === 'rkPrint') await rkExport('print');
  else if (act === 'rkResetOne') await resetHasilSingle(b.dataset.hid);
  else if (act === 'rkResetExamAll') {
    const j = visJadwal().find(x => x.id === S.ui.rekap.j);
    if (!j) return;
    const R = S.ui.rekap;
    const targetRows = rekapRows(j).filter(x => (!R.kelas || x.s.kelas === R.kelas) && x.h);
    await resetHasilBulk(targetRows.map(x => x.h.id), `${examLabel(j)}${R.kelas ? ' — Kelas ' + R.kelas : ''}`);
  }
  else if (act === 'rkResetStudentAll') {
    const sid = S.ui.rekap.siswa;
    if (!sid) return;
    const sw = siswaOf(sid);
    const hs = D().hasil.filter(h => h.siswa_id === sid && visJadwal().some(j => j.id === h.jadwal_id));
    await resetHasilBulk(hs.map(h => h.id), `Seluruh nilai ${sw?.nama || 'siswa'}`);
  }

  /* Pengaturan */
  else if (act === 'setTab') {
    if (b.dataset.t !== S.ui.setTab && !(await guardLeave())) return;
    S.ui.setTab = b.dataset.t;
    renderView();
  }
  else if (act === 'pickColor') {
    const c = b.dataset.c;
    const inp = $('#themeColorInp');
    if (inp) inp.value = c;
    markDirty();
  }
  else if (act === 'icoPick') {
    const { kind, v } = b.dataset;
    S.ui.iconDraft[kind].icon = v;
    markDirty();
    renderView();
  }
  else if (act === 'icoToggleTrans') {
    const { kind } = b.dataset;
    S.ui.iconDraft[kind].transparent = !S.ui.iconDraft[kind].transparent;
    markDirty();
    renderView();
  }
  else if (act === 'dynToggle') {
    const { dk, f } = b.dataset, i = +b.dataset.i;
    const cur = S.ui[dk][i];
    cur[f] = f === 'show' ? (cur.show === false ? true : false) : !cur[f];
    markDirty();
    renderView();
  }
  else if (act === 'dynMove') {
    const { dk } = b.dataset, i = +b.dataset.i, d = +b.dataset.d, ni = i + d;
    if (ni >= 0 && ni < S.ui[dk].length) {
      const tmp = S.ui[dk][i];
      S.ui[dk][i] = S.ui[dk][ni];
      S.ui[dk][ni] = tmp;
      markDirty();
      renderView();
    }
  }
  else if (act === 'dynAdd') {
    const { dk } = b.dataset;
    S.ui[dk].push({ text: 'BARIS TEKS BARU', size: 10, bold: false, italic: false, underline: false, show: true });
    markDirty();
    renderView();
  }
  else if (act === 'dynDel') {
    const { dk } = b.dataset, i = +b.dataset.i;
    if (S.ui[dk].length > 1) {
      S.ui[dk].splice(i, 1);
      markDirty();
      renderView();
    }
  }
  else if (act === 'fillLjkExample') {
    S.ui.ljkTitleDraft = clone(DEFAULT_LJK_TITLE_LINES);
    S.ui.pgHeaderDraft = clone(DEFAULT_PG_HEADER_LINES);
    markDirty();
    toast('Contoh standar keterangan LJK & Area PG diterapkan.');
    renderView();
  }
  else if (act === 'openResetModal') openResetConfirmModal();
  else if (act === 'backup') {
    download('backup_scan_ljk_' + todayISO() + '.json', JSON.stringify({
      exported_at: new Date().toISOString(),
      users: D().guru,
      mata_pelajaran: D().mapel,
      peserta_ujian: D().siswa,
      ujian_sas: D().jadwal,
      hasil_koreksi: D().hasil
    }, null, 2), 'application/json');
  }
  else if (act === 'del') {
    if (!(await confirmBox('Data yang dihapus tidak dapat dikembalikan. Lanjutkan?'))) return;
    const { k, id } = b.dataset;
    const ok = await guard(async () => { await dbDelete(k, id); await reload([k, 'hasil']); return true; }, 'Menghapus data…');
    if (ok) { toast('Data dihapus'); renderView(); }
  }
});

$('#ljkApp').addEventListener('change', async e => {
  const el = e.target, b = el.dataset.bind;
  if (el.id === 'bulkText') {
    updateBulkPreview(el.value);
    return;
  }
  if (el.dataset.resetK) {
    S.ui.resetSel[el.dataset.resetK] = el.checked;
    renderView();
    return;
  }
  if (el.dataset.icoKind) {
    const kind = el.dataset.icoKind, f = el.dataset.icoF;
    S.ui.iconDraft[kind][f] = el.value;
    markDirty();
    renderView();
    return;
  }
  if (el.dataset.esaiIdx !== undefined) {
    const idx = +el.dataset.esaiIdx;
    const j = visJadwal().find(x => x.id === S.ui.manual.j);
    const maks = Number(j?.skor_maks_esai?.[idx]) || 100;
    S.ui.manual.esaiScores[idx] = Math.max(0, Math.min(maks, Number(el.value) || 0));
    el.value = S.ui.manual.esaiScores[idx];
    markDirty();
    refreshManualCards();
    return;
  }
  if (el.dataset.dynKey) {
    const dk = el.dataset.dynKey, i = +el.dataset.i, f = el.dataset.dynF;
    S.ui[dk][i][f] = f === 'size' ? (+el.value || 10) : el.value;
    markDirty();
    renderView();
    return;
  }
  if (el.closest('form[data-form^="settings"]')) {
    markDirty();
  }
  if (!b) return;
  if (b === 'loginKelas') { S.ui.lkelas = el.value; S.ui.lsiswa = ''; render(); }
  else if (b === 'loginSiswa') { S.ui.lsiswa = el.value; }
  else if (b === 'dashJ') { S.ui.dashJ = el.value; renderView(); }
  else if (b === 'kelasF') { S.ui.kelasF = el.value; S.ui.pg.siswa = 1; renderView(); }
  else if (b === 'pgSize') { S.ui.pgSize[el.dataset.k] = +el.value; S.ui.pg[el.dataset.k] = 1; renderView(); }
  else if (b === 'scanJ') {
    if (!(await guardLeave())) { el.value = S.ui.scanJ; return; }
    S.ui.scanJ = el.value; S.ui.scanKelas = ''; S.ui.scanSiswa = ''; S.scanR = null; renderView();
  }
  else if (b === 'scanKelas') {
    S.ui.scanKelas = el.value;
    S.ui.scanSiswa = '';
    renderView();
  }
  else if (b === 'scanSiswa') {
    S.ui.scanSiswa = el.value;
    if (S.scanR) S.scanR.siswaId = el.value;
    renderResult();
  }
  else if (b === 'scanFile') { S.ui.scanMode = 'file'; handleFile(el.files[0]); el.value = ''; }

  else if (b === 'manJ') {
    if (!(await guardLeave())) { el.value = S.ui.manual.j; return; }
    S.ui.manual.j = el.value; S.ui.manual.kelas = ''; S.ui.manual.siswa = ''; syncManualState(true); renderView();
  }
  else if (b === 'manKelas') {
    if (!(await guardLeave())) { el.value = S.ui.manual.kelas; return; }
    S.ui.manual.kelas = el.value; S.ui.manual.siswa = ''; syncManualState(true); renderView();
  }
  else if (b === 'manSiswa') {
    if (!(await guardLeave())) { el.value = S.ui.manual.siswa; return; }
    S.ui.manual.siswa = el.value; syncManualState(true); renderView();
  }

  else if (b === 'studioPgOn') { S.ui.studio.pgOn = el.checked; $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioCols') { S.ui.studio.cols = Math.max(1, Math.min(5, +el.value || 5)); $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioRows') { S.ui.studio.rows = Math.max(1, Math.min(25, +el.value || 10)); $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioMaxPg') { S.ui.studio.maxPg = Math.max(1, Math.min(50, +el.value || 50)); $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioEsaiOn') { S.ui.studio.esaiOn = el.checked; $('#studioSlot').innerHTML = renderStudioOverlay(); }
  else if (b === 'studioEsaiCount') { S.ui.studio.esaiCount = Math.max(1, Math.min(15, +el.value || 5)); $('#studioSlot').innerHTML = renderStudioOverlay(); }

  else if (b === 'rkJ') { S.ui.rekap.j = el.value; S.ui.rekap.kelas = ''; S.ui.pg.rekap = 1; renderView(); }
  else if (b === 'rkKelas') { S.ui.rekap.kelas = el.value; S.ui.rekap.siswa = ''; S.ui.pg.rekap = 1; renderView(); }
  else if (b === 'rkSiswa') { S.ui.rekap.siswa = el.value; renderView(); }

  else if (b === 'siswaCsv') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const raw = parseDelimitedText(await f.text());
    const existingNis = new Set(D().siswa.map(s => String(s.nis || '').trim().toLowerCase()));
    const rows = [];
    raw.forEach(cols => {
      const p = parseSiswaRow(cols);
      if (p && !existingNis.has(p.nis.toLowerCase())) {
        existingNis.add(p.nis.toLowerCase());
        rows.push(p);
      }
    });
    if (!rows.length) return toast('CSV peserta tidak valid atau semua NIS sudah terdaftar.', 'err', 4500);
    const ok = await guard(async () => { await dbInsert('siswa', rows); await reload(['siswa']); return true; }, `Mengimpor ${rows.length} peserta…`);
    if (ok) { toast(`${rows.length} peserta diimpor`); renderView(); }
  }
  else if (b === 'guruCsv') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const raw = parseDelimitedText(await f.text());
    const rows = raw.filter(r => r.length >= 4 && r[1] && r[2] && r[3] && r[2].toLowerCase() !== 'username')
      .map(r => ({ nip: r[0] || '', nama: r[1], username: r[2], password: r[3], aktif: true }));
    if (!rows.length) return toast('CSV guru tidak valid. Format: nip;nama;username;password', 'err', 4500);
    const ok = await guard(async () => { await dbInsert('guru', rows); await reload(['guru']); return true; }, `Mengimpor ${rows.length} guru…`);
    if (ok) { toast(`${rows.length} guru diimpor`); renderView(); }
  }
  else if (b === 'mapelCsv') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    const raw = parseDelimitedText(await f.text());
    const rows = raw.filter(r => r.length >= 1 && r[0] && r[0].toLowerCase() !== 'nama')
      .map(r => ({ nama: r[0], kkm: Number(r[1]) || D().settings.kkm_default || 76 }));
    if (!rows.length) return toast('CSV mapel tidak valid. Format: nama;kkm', 'err', 4500);
    const ok = await guard(async () => { await dbInsert('mapel', rows); await reload(['mapel']); return true; }, `Mengimpor ${rows.length} mapel…`);
    if (ok) { toast(`${rows.length} mata pelajaran diimpor`); renderView(); }
  }
  else if (b === 'restore') {
    const f = el.files[0]; el.value = '';
    if (!f) return;
    if (!(await confirmBox('Pulihkan data dari file backup ini? Pengaturan tampilan tidak akan ditimpa.', 'Pulihkan'))) return;
    const ok = await guard(async () => {
      const o = JSON.parse(await f.text());
      const strip = r => { const x = { ...r }; delete x.id; return x; };
      for (const [jsonKey, appKey] of [['users', 'guru'], ['mata_pelajaran', 'mapel'], ['peserta_ujian', 'siswa'], ['ujian_sas', 'jadwal'], ['hasil_koreksi', 'hasil']]) {
        const list = o[jsonKey] || [];
        if (list.length) await dbInsert(appKey, list.map(strip));
      }
      await reload(['guru', 'mapel', 'siswa', 'jadwal', 'hasil']);
      return true;
    }, 'Memulihkan data…');
    if (ok) { toast('Data operasional berhasil dipulihkan'); renderView(); }
  }
});
