$('#ljkApp').addEventListener('input', e => {
  const el = e.target;
  if (el.closest('form[data-form^="settings"]')) {
    markDirty();
  }
  if (el.dataset.bind === 'q') {
    S.q = el.value;
    S.ui.pg = {};
    const cBtn = $('#clearSearchBtn');
    if (cBtn) cBtn.style.display = S.q ? 'grid' : 'none';
    renderView();
  }
  else if (el.id === 'rkKkmInput') {
    const rawVal = el.value;
    S.ui.rekap.kkmCustom = rawVal === '' ? '' : Math.max(0, Math.min(100, Number(rawVal) || 0));
    S.ui.pg.rekapAkhir = 1;
    renderView();
    const kInp = $('#rkKkmInput');
    if (kInp) { kInp.focus(); const len = String(kInp.value).length; try { kInp.setSelectionRange(len, len); } catch (err) { } }
  }
  else if (el.id === 'pasteKey' && S.ui.jd) {
    const j = D().jadwal.find(x => x.id === S.ui.jd.id);
    const raw = el.value.toUpperCase();
    for (let i = 0; i < S.ui.jd.arr.length; i++) {
      S.ui.jd.arr[i] = normalizeKeyChar(raw[i], j.jumlah_opsi);
    }
    jdRender();
    const nInp = $('#pasteKey');
    if (nInp) { nInp.focus(); nInp.setSelectionRange(raw.length, raw.length); }
  }
  else if (el.id === 'manPastePG') {
    const j = visJadwal().find(x => x.id === S.ui.manual.j);
    if (!j) return;
    const raw = el.value.toUpperCase();
    for (let i = 0; i < S.ui.manual.answers.length; i++) {
      S.ui.manual.answers[i] = normalizeKeyChar(raw[i], j.jumlah_opsi);
    }
    markDirty();
    refreshManualCards();
  }
  else if (el.id === 'bulkText') {
    updateBulkPreview(el.value);
  }
  else if (el.id === 'fNamaUjian') {
    const m = D().mapel.find(x => (x.nama || '').toLowerCase() === el.value.trim().toLowerCase());
    const kkmInp = $('#fKkmUjian');
    if (m && kkmInp) kkmInp.value = m.kkm ?? 76;
  }
  else if (el.id === 'fJmlEsai') {
    const nEsai = Math.max(0, Number(el.value) || 0);
    const bp = $('#fBobotPg');
    if (bp) bp.value = nEsai === 0 ? 100 : (Number(bp.value) === 100 ? 80 : bp.value);
  }
});

$('#ljkApp').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, v = Object.fromEntries(new FormData(f));

  if (kind === 'login') {
    const ok = await guard(async () => {
      if (S.ui.lrole === 'admin') await loginAdmin(v.u, v.p);
      else await loginGuru(v.u, v.p);
      await loadAll();
      return true;
    }, 'Memeriksa kredensial & memuat data…');
    if (ok) { clearDirty(); render(); }
  }
  else if (kind === 'loginSiswa') {
    const ok = await guard(async () => {
      await loginSiswa(v.siswa_id || S.ui.lsiswa);
      return true;
    }, 'Memuat hasil ujian siswa…');
    if (ok) { S.q = ''; clearDirty(); render(); }
  }
  else if (kind === 'guru') {
    const row = { nip: v.nip.trim(), nama: v.nama.trim(), username: v.username.trim(), password: v.password, aktif: !!v.aktif };
    const ok = await guard(async () => {
      if (v.id) await dbUpdate('guru', v.id, row);
      else await dbInsert('guru', [row]);
      await reload(['guru']);
      return true;
    }, 'Menyimpan guru…');
    if (ok) { toast('Data guru tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'mapel') {
    const row = { nama: v.nama.trim(), kkm: +v.kkm };
    const ok = await guard(async () => {
      if (v.id) await dbUpdate('mapel', v.id, row);
      else await dbInsert('mapel', [row]);
      await reload(['mapel']);
      return true;
    }, 'Menyimpan mata pelajaran…');
    if (ok) { toast('Mata pelajaran tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'siswa') {
    const row = { nis: v.nis.trim(), nisn: v.nisn.trim(), nama: v.nama.trim(), kelas: v.kelas.trim(), jenis_kelamin: v.jenis_kelamin, aktif: !!v.aktif };
    const ok = await guard(async () => {
      if (v.id) await dbUpdate('siswa', v.id, row);
      else await dbInsert('siswa', [row]);
      await reload(['siswa']);
      return true;
    }, 'Menyimpan peserta…');
    if (ok) { toast('Data peserta tersimpan'); closeModal(); renderView(); }
  }
  else if (kind === 'jadwal') {
    const kelas_list = [...S.ui.formKelasSel].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
    if (!kelas_list.length) return toast('Pilih minimal satu kelas peserta ujian', 'err');
    const nEsai = Math.max(0, Math.min(20, +v.jumlah_esai || 0));
    const bobotPg = nEsai === 0 ? 100 : Math.max(0, Math.min(100, +v.bobot_pg || 80));
    const bobotEsai = nEsai === 0 ? 0 : (100 - bobotPg);
    const skorPerEsai = Math.max(1, Number(v.skor_per_esai) || 20);
    const row = {
      kode_paket: (v.kode_paket || '').trim(),
      nama_ujian: v.nama_ujian.trim(),
      kkm: +v.kkm,
      guru_id: v.guru_id || null,
      kelas_list,
      kelas: kelas_list.join(', '),
      jumlah_soal: +v.jumlah_soal,
      jumlah_opsi: +v.jumlah_opsi,
      bobot_pg: bobotPg,
      jumlah_esai: nEsai,
      bobot_esai: bobotEsai,
      skor_maks_esai: Array.from({ length: nEsai }, () => skorPerEsai),
      status: v.status
    };
    let targetExamId = v.id || '';
    const ok = await guard(async () => {
      if (v.id) {
        const old = D().jadwal.find(x => x.id === v.id);
        if (old && Array.isArray(old.kunci)) row.kunci = old.kunci.slice(0, row.jumlah_soal);
        await dbUpdate('jadwal', v.id, row);
      } else {
        row.kunci = [];
        const inserted = await dbInsert('jadwal', [row]);
        if (inserted && inserted[0]) targetExamId = inserted[0].id;
      }
      await reload(['jadwal', 'siswa', 'hasil']);
      return true;
    }, 'Menyimpan paket ujian…');
    if (ok) {
      if (targetExamId) {
        S.ui.scanJ = targetExamId;
        S.ui.scanKelas = '';
        S.ui.scanSiswa = '';
        S.scanR = null;
        S.ui.dashJ = targetExamId;
        S.ui.manual.j = targetExamId;
        S.ui.manual.kelas = '';
        S.ui.manual.siswa = '';
        S.ui.rekap.j = targetExamId;
        S.ui.rekap.kelas = '';
      }
      toast('Paket ujian tersimpan & langsung siap digunakan');
      closeModal();
      renderView();
    }
  }
  else if (kind === 'settingsTampilan') {
    const icd = S.ui.iconDraft;
    const patch = {
      app_name: v.app_name.trim() || DEFAULT_SETTINGS.app_name,
      app_subtitle: v.app_subtitle.trim() || DEFAULT_SETTINGS.app_subtitle,
      login_title: v.login_title.trim() || DEFAULT_SETTINGS.login_title,
      login_subtitle: v.login_subtitle.trim() || DEFAULT_SETTINGS.login_subtitle,
      hero_greeting: v.hero_greeting.trim() || DEFAULT_SETTINGS.hero_greeting,
      hero_desc: v.hero_desc.trim() || DEFAULT_SETTINGS.hero_desc,
      hero_cta: v.hero_cta.trim() || DEFAULT_SETTINGS.hero_cta,
      theme_color: v.theme_color || '#1D74F5',
      icon_system: icd.system.icon.trim() || 'scan-line',
      icon_system_color: icd.system.color || '#FFFFFF',
      icon_system_bg: icd.system.bg || '#1D74F5',
      icon_system_transparent: Boolean(icd.system.transparent),
      icon_user: icd.user.icon.trim() || 'user',
      icon_user_color: icd.user.color || '#1D74F5',
      icon_user_bg: icd.user.bg || '#EFF6FF',
      icon_user_transparent: Boolean(icd.user.transparent),
      icon_admin: icd.admin.icon.trim() || 'shield-check',
      icon_admin_color: icd.admin.color || '#1D74F5',
      icon_admin_bg: icd.admin.bg || '#EFF6FF',
      icon_admin_transparent: Boolean(icd.admin.transparent)
    };
    const ok = await guard(async () => { await dbSetSettings(patch); await reload(['settings']); return true; }, 'Menyimpan tampilan & ikon…');
    if (ok) { clearDirty(); toast('Pengaturan tampilan & ikon tersimpan'); render(); }
  }
  else if (kind === 'settingsKop') {
    const patch = {
      logo_kiri: v.logo_kiri.trim(),
      logo_kanan: v.logo_kanan.trim(),
      kop_lines: clone(S.ui.kopDraft || DEFAULT_KOP_LINES),
      ljk_title_lines: clone(S.ui.ljkTitleDraft || DEFAULT_LJK_TITLE_LINES),
      pg_header_lines: clone(S.ui.pgHeaderDraft || DEFAULT_PG_HEADER_LINES),
      show_ttd_siswa: !!v.show_ttd_siswa,
      show_nilai_guru: !!v.show_nilai_guru,
      kota: v.kota.trim(),
      kepala_sekolah: v.kepala_sekolah.trim(),
      nip_kepala: v.nip_kepala.trim(),
      kkm_default: +v.kkm_default
    };
    const ok = await guard(async () => { await dbSetSettings(patch); await reload(['settings']); return true; }, 'Menyimpan kop surat & LJK…');
    if (ok) { clearDirty(); toast('Pengaturan kop surat & LJK tersimpan'); render(); }
  }
  else if (kind === 'confirmReset') {
    await executeResetSystem(v.admin_pass);
  }
});

/* ===================== INISIALISASI PWA & BOOTSTRAP ===================== */
function registerDynamicSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const swCode = `const CACHE='scan-ljk-v6';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});`;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => { });
  } catch (e) { }
}

async function boot() {
  registerDynamicSW();
  applyTheme();
  if (IS_PREVIEW) {
    seedDummyPreview();
    await loadAll();
    render();
    return;
  }
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    try { await reload(['settings', 'siswa', 'jadwal', 'hasil', 'mapel']); } catch (e) { }
    onAuthStateChanged(auth, async u => {
      if (u && (!S.user || S.user.role === 'admin')) {
        S.user = { role: 'admin', id: u.uid, nama: formatAdminName(u.email), email: u.email };
        await guard(() => loadAll(), 'Memuat data dari Firestore…');
        render();
      } else if (!u && S.user?.role === 'admin') {
        S.user = null;
        render();
      } else {
        render();
      }
    });
  } catch (e) {
    S.setupError = 'Gagal menginisialisasi Firebase: ' + errMsg(e);
    render();
  }
}

boot();
</script>
